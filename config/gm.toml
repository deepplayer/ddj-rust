# gm 服配置
# GM 后台：对齐原 11 个 PHP + CDK
#
# 加载顺序：内置默认 → 本文件 → gm.{env}.toml → 环境变量
# 环境变量格式：DDJ__DB__GAME_URL=...（双下划线分层，见 docs/ARCHITECTURE.md）
# 字段与 crates/foundation/config/src/schema.rs 一一对应，deny_unknown_fields 会拒绝拼错的键。

[service]
name        = "gm"
server_id   = 0
cross_group = 0

[net]
tcp_listen        = "0.0.0.0:8080"
http_listen       = "127.0.0.1:20886"
# rpc_listen 不配 = 不启用跨服 RPC
idle_timeout_secs = 180
max_conn_per_ip   = 8
max_conn_total    = 20000

[db]
# MySQL 5.7 的内部 SSL 与 sqlx 默认 TLS 握手不兼容，本地/内网一律显式关闭：
# .../platform?ssl-mode=DISABLED
platform_url         = "postgres://game@127.0.0.1:5432/platform"
game_url             = "postgres://game@127.0.0.1:5432/game_7010544"
max_connections      = 16
acquire_timeout_secs = 5

[redis]
url         = "redis://127.0.0.1:6379"
key_prefix  = "ddj:0"
lock_ttl_ms = 3000

[template]
dir           = "../../data/apps/game_7010544/template"
load_on_start = true
strict        = false          # 原表有 `sting` 笔误，非严格模式容忍

[telemetry]
log_level  = "info"
log_format = "json"
metrics    = true

[gameplay]
item_use_limit = 999           # 原 useLimit 的服务端兜底
bag_capacity   = 500
mail_keep_days = 30
