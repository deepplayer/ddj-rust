syntax = "proto2";

package bf.messages.game.HomelandMessage;

import "CommonMsgMessage.proto";
import "PlayerMessage.proto";

message MsgHomeland {
    optional int32 lv = 1;
    optional int32 exp = 2;
    repeated MsgFashion fashions = 3;
    repeated int32 useFashionIds = 4;
    repeated int32 attackTalentIds = 5;
    repeated int32 defenseTalentIds = 6;
    repeated int32 newLogType = 7;
    repeated MsgCell farmCells = 11;
    repeated MsgCell pastureCells = 12;
    repeated MsgCarriage carriage = 21;
    optional bool enabledPsw = 22;
    optional string psw = 23;
    repeated int32 carriageNewLogType = 24;
    optional int64 nextRefreshTime = 25;
}

message MsgCell {
    required int32 seatId = 1;
    optional int32 goodsId = 2;
    optional int64 endTime = 3;
    optional int32 status = 4;
}

message MsgYield {
    optional int32 seatId = 1;
    optional int32 exp = 2;
    optional int32 extraExp = 5;
    optional bf.messages.game.CommonMsgMessage.MsgResources reward = 3;
    optional bf.messages.game.CommonMsgMessage.MsgResources extraReward = 4;
}

message MsgHarvest {
    repeated MsgYield yield = 1;
    optional int32 lv = 2;
    optional int32 exp = 3;
    repeated MsgCell farmCells = 4;
    repeated MsgCell pastureCells = 5;
}

message MsgFashion {
    optional int32 id = 1;
    optional int32 lv = 2;
}

message MsgOtherHomeland {
    optional MsgHomeland homeland = 1;
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 2;
    optional bool isFriendOrFamily = 3;
    optional int32 surplusHelpNum = 6;
    optional int32 surplusStealNum = 7;
    optional int32 surplusInputNum = 8;
}

message MsgLog {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources resources = 3;
    optional int64 time = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgResources extraResources = 5;
}

message MsgHomelandOfflineData {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 1;
    optional int32 houseLv = 2;
    optional int32 houseExp = 3;
    optional bool existRipe = 4;
    optional bool carriageUnlock = 5;
    repeated int32 carriageGoodsId = 6;
    repeated int32 carriageAdd = 7;
}

message MsgBattleResultData {
    repeated bf.messages.game.CommonMsgMessage.MsgResources reward = 1;
}

message MsgCarriage {
    optional int32 type = 1;
    optional int32 status = 2;
    repeated MsgCarriageOrder orders = 3;
    optional int32 bigMapId = 4;
}

message MsgCarriageOrder {
    optional int32 templateId = 1;
    optional int32 goodsId = 2;
    optional int32 curNum = 3;
    optional int32 maxNum = 4;
    optional bf.messages.game.CommonMsgMessage.MsgResources price = 5;
    optional int32 selfSaleNum = 6;
    optional int32 personMaxNum = 7;
}

message MsgCarriageLog {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 1;
    optional bf.messages.game.CommonMsgMessage.MsgResources hisSale = 2;
    optional bf.messages.game.CommonMsgMessage.MsgResources hisProfit = 3;
    optional bf.messages.game.CommonMsgMessage.MsgResources myProfit = 4;
    optional bf.messages.game.CommonMsgMessage.MsgResources mySurplus = 5;
    optional int64 time = 6;
}

message MsgExtendReq_44001 {
    optional int32 seatId = 1;
    optional int32 type = 2;
}

message MsgExtendResp_44001 {
    required int32 ret = 1;
