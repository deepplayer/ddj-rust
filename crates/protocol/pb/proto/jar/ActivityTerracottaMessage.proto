syntax = "proto2";

package bf.messages.game.ActivityTerracottaMessage;

import "ActivityCrossChessMessage.proto";
import "CommonMsgMessage.proto";
import "FamilyMessage.proto";
import "GmActivityMessage.proto";
import "PetMessage.proto";
import "PlayerMessage.proto";
import "RankingMessage.proto";
import "TalentMessage.proto";

message MsgMapData {
    optional int32 roomId = 1;
    optional int64 lastFightTime = 2;
    optional int32 familyMemberNum = 3;
    optional bool isCollapse = 4;
}

message MsgBossRoomData {
    optional int32 type = 1;
    optional string curHp = 2;
    optional string maxHp = 3;
    optional int64 beginTime = 4;
    optional int64 endTime = 5;
}

message MsgBattleTalent {
    optional int32 talentId = 1;
    optional string curHp = 2;
    optional string maxHp = 3;
    optional int32 mapId = 4;
}

message MsgRoomData {
    repeated int32 updateFieldsList = 90;
    repeated int32 boxType = 1;
    optional int32 allPeople = 2;
    optional int32 familyPeople = 3;
    optional int32 boxNum = 4;
    optional MsgEventData msgEventData = 5;
    optional MsgBattleTalent msgBattleTalent = 6;
    repeated MsgBoxData msgBoxData = 7;
    optional int32 rank = 8;
    optional string score = 9;
}

message MsgEventData {
    optional int32 eventId = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 2;
    optional bf.messages.game.TalentMessage.MsgTalentData msgTalentData = 3;
    optional bf.messages.game.PetMessage.MsgPetData msgPetData = 4;
    optional string curHp = 5;
    optional string maxHp = 6;
    repeated int32 box = 7;
    optional bool isFinish = 8;
    optional string robScore = 9;
}

message MsgBoxData {
    optional int64 uniqueId = 1;
    optional int32 boxId = 2;
    optional int64 openTime = 3;
    optional int32 pos = 4;
}

message MsgDefenceHist {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 1;
    optional string damage = 2;
    optional int32 percent = 3;
}

message MsgExploreHist {
    optional int32 templateId = 1;
    repeated string replaceStr = 2;
    optional int64 eventTime = 3;
    optional bool isWin = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 5;
}

message MsgBossRoomTalentData {
    repeated int32 updateFieldsList = 90;
    optional MsgTopFamilyData msgTopFamilyData = 1;
    optional int64 endTime = 2;
    optional MsgTreasureOwnerData msgTreasureOwnerData = 3;
    optional bool buff = 4;
    optional int32 time = 5;
    optional int64 updateTime = 6;
    repeated MsgRecentOpenBoxHist msgRecentOpenBoxHist = 7;
    optional MsgTreasureResult msgTreasureResult = 8;
    repeated MsgUseTalent msgUseTalent = 9;
}

message MsgTopFamilyData {
    optional int64 familyId = 1;
    optional string familyName = 2;
    optional int32 serverId = 3;
    optional int32 time = 4;
    optional int64 updateTime = 5;
}

message MsgTreasureOwnerData {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 1;
    optional bf.messages.game.TalentMessage.MsgTalentData msgTalentData = 2;
    optional bf.messages.game.PetMessage.MsgPetData msgPetData = 3;
    optional int32 time = 4;
    optional int64 updateTime = 5;
    optional string curHp = 6;
    optional string maxHp = 7;
    optional bool buff = 8;
    optional int32 winTimes = 9;
    optional int32 state = 10;
}

message MsgBossData {
    optional string curHp = 1;
    optional string maxHp = 2;
    optional int64 endTime = 3;
    repeated MsgRecentAttackHist msgRecentAttackHist = 4;
    optional bf.messages.game.PlayerMessage.MsgCrossUser lastShot = 5;
    repeated MsgUseTalent msgUseTalent = 6;
    optional int64 beginTime = 7;
}

message MsgRecentAttackHist {
    optional int64 id = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 2;
    optional string damage = 3;
    optional int64 attackTime = 4;
}

message MsgRecentOpenBoxHist {
    optional int64 id = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources resourceGet = 3;
    optional int64 openTime = 4;
}

message MsgTreasureResult {
    optional int64 familyId = 1;
    optional string familyName = 2;
    optional int32 serverId = 3;
    repeated MsgTreasureOwnerHist msgTreasureOwnerHist = 4;
    optional MsgFinalTreasure msgFinalTreasure = 5;
}

message MsgTreasureOwnerHist {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 1;
    optional int32 time = 2;
}

message MsgFinalTreasure {
    optional int32 boxId = 1;
    optional bool isOpen = 2;
}

message MsgUseTalent {
