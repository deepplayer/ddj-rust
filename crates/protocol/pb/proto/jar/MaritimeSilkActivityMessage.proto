syntax = "proto2";

package bf.messages.game.MaritimeSilkActivityMessage;

import "CommonMsgMessage.proto";
import "GmActivityMessage.proto";
import "PlayerMessage.proto";
import "StageMessage.proto";

message MsgMaritimeAllTemplateData {
    repeated bf.messages.game.GmActivityMessage.MsgRank msgRank = 1;
    repeated MsgOceanRewardTemplate oceanRewards = 2;
}

message MsgOceanRewardTemplate {
    optional int32 activityId = 1;
    optional int32 activityType = 2;
    optional int32 taskId = 3;
    optional int64 param1 = 4;
    optional string reward = 5;
    optional int32 jump = 6;
}

message MsgMaritimeSilkPlayerData {
    repeated int32 updateFieldsList = 90;
    optional int32 stage = 1;
    optional int64 historyCurrency = 2;
    optional int32 playerRank = 3;
    optional int64 goodsRTime = 4;
    optional int64 shipsRTime = 5;
    optional int32 shipLv = 6;
    optional int32 shipState = 7;
    optional MsgCity msgCity = 8;
    repeated MsgGoods goods = 9;
    repeated int32 drawType = 10;
    repeated MsgStageTaskState stageState = 11;
    optional MsgSailEvent selfSail = 12;
    optional MsgPirateEvent selfPirate = 13;
    repeated MsgPlunderPlayer otherSails = 14;
    repeated int32 redDots = 15;
    repeated bf.messages.game.StageMessage.MsgTalentStatus talentEscortStatus = 16;
    repeated bf.messages.game.StageMessage.MsgTalentStatus talentRobStatus = 17;
    optional int32 familyRank = 18;
    optional bool isJoin = 19;
    optional int64 lackGoodsRTime = 20;
    optional int32 crossVersion = 21;
}

message MsgStageTaskState {
    optional int32 taskId = 1;
    optional int32 state = 2;
}

message MsgGoods {
    optional int64 bulkId = 1;
    optional int32 goodsId = 2;
    optional int32 price = 3;
    optional int64 num = 4;
    optional bool fromRob = 5;
    optional bool notSale = 6;
}

message MsgCity {
    optional int32 cityId = 1;
    repeated MsgGoods saleGoods = 2;
    repeated int32 lackGoodsIds = 3;
    optional bool reported = 4;
}

message MsgPirateEvent {
    optional int64 evtId = 1;
    optional string playerId = 2;
    optional int32 pirateId = 3;
    optional string hp = 4;
    optional string killer = 5;
    optional int64 leaveTime = 6;
    optional int32 state = 7;
    optional int64 eventTime = 8;
    optional int64 lastAtkTime = 9;
    optional bool marked = 10;
    optional string finderName = 11;
    optional string killerId = 12;
}

message MsgSailEvent {
    optional string playerId = 1;
    optional int32 targetCity = 2;
    optional int32 escortTalent = 3;
    optional int64 arriveTime = 4;
    optional int32 state = 5;
    optional int64 eventTime = 6;
    optional int32 atkState = 7;
    optional int32 startCity = 8;
    optional int64 currencyX = 9;
    optional int64 currencyY = 10;
    optional int32 escortTalentUseSkinId = 11;
    optional int64 goodsValueX = 12;
    optional int64 goodsValueY = 13;
    optional int32 sailShipLv = 14;
    optional int32 skinAwake = 15;
}

message MsgMaritimeSilkPlayer {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer msgPlayer = 1;
    optional int32 shipLv = 2;
    optional int64 historyCurrency = 3;
    optional string familyName = 4;
}

message MsgPlunderPlayer {
    optional MsgMaritimeSilkPlayer msgMSPlayer = 1;
    optional MsgSailEvent sailEvt = 2;
    optional int32 robTimes = 3;
}

message MsgFamilyReport {
    repeated MsgPirateEvent pirateEvts = 1;
}

message MsgDefenceEvent {
    optional int64 evtId = 1;
    optional MsgPlunderPlayer player = 2;
    optional bool win = 3;
    optional bool beatBack = 4;
    optional int64 eventTime = 5;
    repeated bf.messages.game.CommonMsgMessage.MsgResources lost = 6;
    optional int32 defenceType = 7;
}

message MsgDefenceReport {
    repeated MsgDefenceEvent defences = 1;
}

message MsgCityInformation {
    optional MsgCity msgCity = 1;
    optional string name = 2;
}

message MsgCitySimpleInfo {
    optional int32 cityId = 1;
    optional string name = 2;
    repeated int32 lackGoods = 3;
}

message MsgMaritimeTalentBrief {
    optional string playerId = 1;
    required int32 talentId = 2;
    optional int32 degree = 3;
    optional int32 skinId = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgTalentSkin skins = 5;
    optional string money = 6;
    optional int32 lv = 7;
}

message MsgFamilyChannelPirateReplaceStr {
    repeated string replaceStr = 1;
}

message MsgMaritimeGoodsSign {
    optional MsgGoods goods = 1;
    optional int32 cityId = 2;
}

message MsgMaritimeBusinessLog {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer msgPlayer = 1;
    optional int32 goodsId = 2;
    optional int64 num = 3;
    optional string currency = 4;
    optional bool sale = 5;
    optional int64 time = 6;
}

message MsgMaritimeSailLog {
    optional int32 type = 1;
