syntax = "proto2";

package bf.messages.game.FamilyMessage;

import "CommonMsgMessage.proto";
import "PlayerMessage.proto";
import "HomelandMessage.proto";

message MsgFamilyData {
    repeated int32 updateFieldsList = 90;
    optional int64 familyId = 1;
    optional string name = 2;
    optional int32 iconId = 3;
    optional string declaration = 4;
    optional string notice = 5;
    optional int32 autoJoin = 6;
    optional string patriarchId = 7;
    optional string patriarchName = 8;
    optional int32 memberCnt = 9;
    optional string money = 10;
    optional int32 level = 11;
    optional int32 exp = 12;
    optional int32 rank = 13;
    optional int64 donateResetTime = 14;
    optional int32 donateNum = 15;
    optional int64 forbitEditTime = 16;
    optional string qq = 17;
    optional string wx = 18;
    optional int32 serverId = 19;
    optional int64 qqCoolingTime = 20;
    optional int64 wxCoolingTime = 21;
    optional int64 dissolutionFamilyTime = 22;
}

message MsgLastExitFamilyInfo {
    optional int64 id = 1;
    optional string name = 2;
    optional int32 icoId = 3;
}

message MsgFamilyMemberData {
    repeated int32 updateFieldsList = 90;
    optional int64 familyId = 1;
    optional string memberId = 2;
    repeated int32 fashionIds = 3;
    optional int32 viplv = 4;
    optional string name = 5;
    optional string money = 6;
    optional int32 job = 7;
    optional int64 lastExitTime = 8;
    optional int64 offline = 9;
    optional int32 npcSex = 10;
    optional int32 lv = 11;
    optional string historyContribution = 12;
    optional int32 sex = 13;
    optional int64 lastDonateTime = 14;
    optional int32 lastDonateType = 15;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 16;
    repeated int64 lastDonateTimes = 17;
    optional int32 monthCard = 18;
    optional MsgLastExitFamilyInfo lastExitFamilyInfo = 19;
}

message MsgFamilyJoinData {
    optional string memberId = 1;
    optional string name = 2;
    optional int32 lv = 3;
    optional int32 viplv = 4;
    optional string money = 5;
    repeated int32 fashionIds = 6;
    optional int64 joinTime = 7;
    optional int32 sex = 8;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 9;
    optional int32 monthCard = 10;
    optional int32 npcSex = 11;
}

message MsgFamilyLoginData {
    optional MsgFamilyMemberData msgFamilyMemberData = 1;
    repeated MsgFamilyJoinData msgFamilyJoinData = 2;
}

message MsgFamilyEventData {
    optional int32 event = 1;
    optional int64 familyId = 2;
    optional string name = 3;
    optional int64 time = 4;
    optional int32 job = 5;
    optional int32 familyIco = 6;
    optional int32 preLv = 7;
    optional string playerName = 8;
}

message MsgCrossFamilyData {
    repeated int32 updateFieldsList = 90;
    optional int64 familyId = 1;
    optional string familyName = 2;
    optional int32 icon = 3;
    optional int32 serverId = 4;
    optional string totalMoney = 5;
    optional int32 memberCnt = 6;
    optional string ownerName = 7;
    optional int32 lv = 8;
}

message MsgFamilySimpleInfo {
    optional int64 familyId = 1;
    optional string name = 2;
    optional int32 iconId = 3;
    optional string declaration = 4;
    optional string patriarchId = 7;
    optional string patriarchName = 8;
    optional int32 memberCnt = 9;
    optional string money = 10;
    optional int32 level = 11;
    optional int32 serverId = 12;
}

message MsgFamilyMemberSimpleInfo {
    optional string memberId = 2;
    repeated int32 fashionIds = 3;
    optional int32 viplv = 4;
    optional string name = 5;
    optional string money = 6;
    optional int32 job = 7;
    optional int32 lv = 11;
    optional int32 sex = 13;
    optional int32 npcSex = 14;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 16;
}

message MsgRedPacketGainRecord {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 1;
    optional int32 num = 2;
    optional int64 time = 3;
}

message MsgFamilyDataResp_6001 {
    optional MsgFamilyData familyData = 1;
}

message MsgFamilyMemberDataResp_6002 {
    repeated MsgFamilyMemberData familyMemberData = 1;
}

message FamilyCreateReq_6003 {
    optional string name = 1;
    optional int32 iconId = 2;
    optional string declaration = 3;
    optional string notice = 4;
    optional int32 autoJoin = 5;
}

message FamilyCreateResp_6003 {
    required int32 ret = 1;
}

message FamilyJoinReq_6004 {
