    optional string icon = 8;
    optional string reward = 9;
}

message MsgColiseumCrossData {
    optional int64 integral = 1;
    optional int32 index = 3;
    optional int64 useCot = 2;
    optional MsgColiseumCrossEntryData toMsgColiseumCrossEntryData = 4;
    repeated int32 talentIds = 5;
    optional MsgColiseumCrossNoticeEntryData noticeEntryData = 6;
    repeated int32 achievementId = 7;
    repeated int32 rankType = 8;
    repeated bf.messages.game.RankingMessage.MsgRankingEntryData msgRankingEntryData = 9;
    optional bool join = 10;
    optional string manifesto = 11;
}

message MsgColiseumCrossEntryData {
    optional int32 index = 1;
    optional string playerId = 2;
    optional string name = 3;
    repeated int32 fashionIds = 4;
    optional int32 sex = 5;
    optional int32 lv = 6;
    optional int64 integral = 7;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 8;
    optional int32 serverId = 9;
    optional string money = 10;
    optional int32 talentNum = 11;
    optional string manifesto = 12;
    optional bool join = 13;
    optional int32 npcSex = 14;
}

message MsgColiseumCrossBattleResultData {
    optional int64 oldIntegral = 1;
