    repeated bf.messages.game.GmActivityMessage.MsgRank msgRank = 2;
}

message MsgColiseumCrossPlayerData {
    optional int64 useCot = 1;
    optional int32 index = 2;
    optional int64 var = 3;
    repeated int32 rankType = 4;
    optional bool join = 5;
    optional MsgColiseumCrossTopData msgColiseumCrossTopData = 6;
}

message MsgColiseumCrossTopData {
    optional string topId = 11;
    optional int32 topServerId = 12;
