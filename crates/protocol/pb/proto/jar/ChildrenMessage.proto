    required int32 type = 3;
}

message getMarriedResp_24016 {
    required int32 ret = 1;
    optional MsgMarriageProposeData msgMarriageProposeData = 2;
    optional MsgNewlywed msgNewlywed = 3;
}

message syncNewlywedResp_24017 {
