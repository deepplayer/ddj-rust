}

message cancelMarriageProposeResp_24010 {
    required int32 ret = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 2;
}

message getGraduateReq_24011 {
}

message getGraduateResp_24011 {
