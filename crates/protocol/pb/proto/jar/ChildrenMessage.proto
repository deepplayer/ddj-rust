syntax = "proto2";

package bf.messages.game.ChildrenMessage;

import "CommonMsgMessage.proto";
import "FamilyMessage.proto";
import "PlayerMessage.proto";

message MsgChildrenData {
    repeated int32 updateFieldsList = 90;
    optional string childId = 1;
    optional string name = 2;
    optional int32 sex = 3;
    optional int32 parentId = 4;
    optional int32 quality = 5;
    optional int32 lv = 6;
    optional int32 exp = 7;
    optional string money = 8;
    optional int32 posId = 9;
    optional int32 image = 10;
    optional int64 energy = 11;
    optional int64 cdTime = 12;
    optional int64 intimacy = 13;
    optional MsgProposal msgProposal = 14;
    optional int32 talentId = 15;
}

message MsgChildName {
    optional string childId = 1;
    optional string name = 2;
}

message MsgProposal {
    optional string nickName = 1;
    optional int64 endTime = 2;
    optional int32 type = 3;
}

message MsgMarriageProposeData {
    repeated int32 updateFieldsList = 90;
    optional int64 id = 1;
    optional string nickName = 2;
    optional string childName = 3;
    optional int32 image = 4;
    optional string money = 5;
    optional int64 endTime = 6;
    optional int32 sex = 7;
    optional string familyName = 8;
    optional int32 serverId = 9;
    optional bool isFromChat = 10;
    optional string toPlayerId = 11;
}

message MsgCoupleData {
    repeated MsgAdult msgAdult = 1;
    required string nickName = 2;
    required int64 weddingTime = 3;
    required int64 id = 4;
    optional string otherPlayerId = 5;
    optional int32 serverId = 6;
}

message MsgAdult {
    required string childId = 1;
    required string name = 2;
    required int32 sex = 3;
    required int32 image = 4;
    required string money = 5;
    required bool isMine = 6;
}

message MsgAdultVisit {
    optional int32 visitNum = 1;
    optional int64 resetTime = 2;
    optional int32 recoveryNum = 3;
}

message MsgNewlywed {
    required MsgCoupleData msgCoupleData = 1;
}

message MsgAdvertisementState {
    optional int64 advertisementId = 1;
    optional bool isCross = 2;
}

message MsgWorldNoticeState {
    optional MsgAdvertisementState msgState = 1;
    optional int64 endTime = 2;
}

message MsgTrainMiracle {
    optional string childId = 1;
    optional int32 multiple = 2;
}

message MsgRecentlyPlayer {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer msgPlayer = 1;
    optional bf.messages.game.FamilyMessage.MsgFamilyData msgFamily = 2;
}

message MsgMarriageParam {
    optional bool isRefuseCross = 1;
    optional bool isOpen = 2;
    optional string money = 3;
}

message MsgReject {
    optional string fromPlayerId = 1;
    repeated int64 advertisementId = 2;
}

message MsgTurnBack {
    optional int32 groupId = 1;
    repeated int64 uniqueId = 2;
    optional int32 type = 3;
}

message GetChildReq_24001 {
}

message GetChildResp_24001 {
    required int32 ret = 1;
    repeated MsgChildrenData data = 2;
    optional string lastName = 3;
    optional int32 activeNum = 4;
}

message NameChildReq_24002 {
    required int32 type = 1;
    repeated MsgChildName msgChildName = 2;
}

message NameChildResp_24002 {
    required int32 ret = 1;
}

message BuyChildPositionReq_24003 {
    required int32 posId = 1;
}

message BuyChildPositionResp_24003 {
    required int32 ret = 1;
}

message TrainChildReq_24004 {
    required string childId = 1;
}

message TrainChildResp_24004 {
    required int32 ret = 1;
}

message RecoveryEnergyReq_24005 {
    required string childId = 1;
}

message RecoveryEnergyResp_24005 {
    required int32 ret = 1;
}

message GraduateReq_24006 {
    required string childId = 1;
}

message GraduateResp_24006 {
    required int32 ret = 1;
    repeated string childId = 2;
    optional bool isOneKey = 3;
}

message ProposeMarriageReq_24007 {
    required string childId = 1;
    required string toPlayerId = 2;
    required int32 type = 3;
    optional bool isSendNotice = 4;
    optional bool isSendFamily = 5;
    optional bool isSendCross = 6;
}

message ProposeMarriageResp_24007 {
    required int32 ret = 1;
}

message GetMarriageRequestListReq_24008 {
}

message GetMarriageRequestListResp_24008 {
    repeated MsgMarriageProposeData msgMarriagePropose = 1;
}

message DealWithRequestReq_24009 {
    required bool isAccept = 1;
    optional int64 id = 2;
    optional string childId = 3;
    optional int32 type = 4;
    optional bool isFromChat = 5;
}

message DealWithRequestResp_24009 {
    required int32 ret = 1;
    optional MsgNewlywed msgNewlywed = 3;
}

message cancelMarriageProposeReq_24010 {
