message getCoupleReq_24013 {
}

message getCoupleResp_24013 {
    required int32 ret = 1;
    repeated MsgCoupleData msgCoupleData = 2;
    optional MsgAdultVisit msgAdultVisit = 3;
}

message receiveGiftReq_24014 {
}

message receiveGiftResp_24014 {
    required int32 ret = 1;
    optional MsgAdultVisit msgAdultVisit = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 3;
}

message syncGradeResp_24015 {
