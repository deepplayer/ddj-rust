}

message getRedDotResp_24018 {
    repeated int32 updateFieldsList = 90;
    optional bool isRequest = 1;
    optional bool isSetApplyMoney = 2;
    optional bool isHaveCouple = 3;
}

message syncNewlywedResp_24019 {
