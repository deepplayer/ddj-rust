message MsgMohist {
    repeated int32 updateFieldsList = 99;
    optional int32 sceneType = 1;
    optional MsgTurntable msgTurntable = 2;
    optional bf.messages.game.CommonMsgMessage.MsgActivityGift MsgGift = 3;
    optional MsgEnemyBuilding msgEnemyBuilding = 4;
    repeated MsgFamilyBuilding msgEnemy = 5;
    optional int32 playerRank = 6;
    optional string playerScore = 7;
    optional string buildScore = 8;
    optional int32 familyRank = 9;
    optional string parts = 10;
    optional string coin = 11;
    optional int32 rollCnt = 12;
    optional int32 vipCnt = 13;
    optional bool isLockTalent = 14;
}

message MsgTurntable {
    optional int32 tableId = 1;
    optional int32 index = 2;
}

message MsgOneKeyParam {
    optional bool isAttack = 1;
    optional bool isSnackAttack = 2;
    optional bool isSpecialTable = 3;
}

message MsgResult {
    optional int32 tableId = 1;
    optional int32 index = 2;
    optional int32 id = 3;
    optional string parts = 4;
    optional string coin = 5;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 6;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData msgPvPBattleData = 7;
}

message MsgEnemyBuilding {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 playerRank = 2;
    optional string buildScore = 3;
    repeated MsgBuilding msgBuilding = 4;
}

message MsgBlacksmithShop {
    optional string parts = 1;
    optional int64 startTime = 2;
    optional int64 endTime = 3;
    optional int32 familyStationLv = 4;
}

message MsgBattleReport {
    optional int64 id = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 2;
    optional int32 type = 3;
    optional int64 timeStamp = 4;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData msgPvPBattleData = 5;
    optional bool isFightBack = 6;
}

message MsgBuilding {
    repeated int32 updateFieldsList = 99;
    optional int32 id = 1;
    optional int32 buildingId = 2;
    optional int32 lv = 3;
    optional int32 curHp = 4;
    optional int32 maxHp = 5;
    optional int32 percent = 6;
    optional int64 timeStamp = 7;
    optional string coinStore = 8;
    optional int32 rebuildCnt = 9;
}

message MsgFamilyBuilding {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional string toBuildScore = 2;
    optional bool isCanFix = 3;
}

message MsgHelp {
    optional int32 helpCnt = 1;
    optional int64 timeStamp = 2;
}

message MsgMohistBattleExtra {
    optional MsgBuilding msgBuilding = 1;
    optional string damage = 2;
    optional string buildScore = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgAtk = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgDurability = 5;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgWreck = 6;
    repeated MsgMohistPlayer msgMohistPlayer = 7;
}

message MsgMohistPlayer {
    optional string playerId = 1;
    repeated MsgMohistSkill msgSkill = 2;
    repeated MsgMohistExtraMoney MsgExtraMoney = 3;
}

message MsgMohistSkill {
    optional int32 buffId = 1;
    optional int32 prob = 2;
    optional int32 param = 3;
}

message MsgMohistExtraMoney {
    optional int32 talentId = 1;
    optional string money = 2;
}

