message WestJourneyGetMoppingUpInfoReq_38560 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    required MsgWestJourneyCrossRunMap map = 2;
}

message WestJourneyGetMoppingUpInfoResp_38560 {
    required int32 ret = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources reward = 2;
}

message WestJourneyMoppingUpReq_38561 {
