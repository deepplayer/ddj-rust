    optional int32 finish = 7;
    optional MsgWestJourneyTeam team = 8;
    optional bool reload = 9;
    repeated MsgWestJourneyMatchNpc npcs = 10;
    repeated MsgWestJourneyMatchNpcHarm npcHarm = 11;
