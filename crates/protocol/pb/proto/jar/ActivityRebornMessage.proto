syntax = "proto2";

package bf.messages.game.ActivityRebornMessage;

import "FamilyMessage.proto";
import "GmActivityMessage.proto";
import "PlayerMessage.proto";

message MsgTopBrief {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional string familyName = 2;
    repeated MsgApplyBrief msgApply = 3;
    optional int32 alreadyCnt = 4;
    optional bool isApply = 5;
}

message MsgApplyBrief {
    optional int32 level = 1;
    optional int32 num = 2;
}

message MsgRebornCondition {
    optional int32 id = 1;
    optional bool isAccord = 2;
}

message MsgApplicants {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 level = 2;
    optional int32 deal = 3;
    optional int32 refuseCnt = 4;
    optional int32 state = 5;
}

message MsgApplyResult {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 totalCnt = 2;
    optional int32 state = 3;
}

message MsgApplication {
    optional bool isPass = 1;
    repeated string playerId = 2;
}

message MsgAlive {
    optional string playerId = 1;
    optional string money = 2;
}

message MsgAliveRank {
    optional string playerId = 1;
    optional int32 rank = 2;
}

message MsgRebornList {
    optional int32 level = 1;
    optional int32 peopleCnt = 2;
}

message MsgTable {
    optional int32 typeId = 1;
    repeated string entity = 2;
}

message MsgBuyRecord {
    optional int32 giftId = 1;
    optional int32 buyCnt = 2;
}

message MsgRebornPlayer {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 level = 2;
    optional string oldPlayerName = 3;
    optional int32 targetServerId = 4;
}

message GetListOfApplyReq_28001 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    optional int32 index = 2;
}

message GetListOfApplyResp_28001 {
    required int32 ret = 1;
    optional int32 level = 2;
    optional int32 applyCnt = 3;
    repeated MsgTopBrief msgTop = 4;
}

message ConfirmRebornReq_28002 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    required int32 targetServerId = 2;
    optional bool isReborn = 3;
}

message ConfirmRebornResp_28002 {
    required int32 ret = 1;
    repeated MsgRebornCondition msgCondition = 2;
    optional int32 rank = 3;
}

message DeliveryApplyReq_28003 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    required int32 targetServerId = 2;
}

message DeliveryApplyResp_28003 {
    required int32 ret = 1;
    optional int32 applyCnt = 2;
    repeated MsgTopBrief msgTop = 3;
}

message GetApplicationReq_28004 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
}

message GetApplicationResp_28004 {
    required int32 ret = 1;
    repeated MsgApplyBrief msgApply = 2;
    repeated MsgApplicants msgApplicants = 3;
}

message DealWithApplyReq_28005 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    required string toPlayerId = 2;
    required bool isPass = 3;
}

message DealWithApplyResp_28005 {
    required int32 ret = 1;
    repeated MsgApplicants msgApplicants = 2;
}

message GetApplyResultReq_28006 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
}

message GetApplyResultResp_28006 {
    required int32 ret = 1;
    repeated MsgApplyResult msgResult = 2;
    optional int32 level = 3;
    repeated MsgBuyRecord msgBuyRecord = 4;
    repeated MsgRebornPlayer msgImmigration = 5;
    repeated MsgRebornPlayer msgEmigration = 6;
}

message RebornReq_28007 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    optional int32 targetServerId = 2;
}

message RebornResp_28007 {
    required int32 ret = 1;
}

message GetListOfApplyCsRemote_28008 {
