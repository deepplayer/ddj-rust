syntax = "proto2";

package bf.messages.game.RankingMessage;

import "CommonMsgMessage.proto";
import "FamilyMessage.proto";

message MsgRankingEntryData {
    optional string key = 1;
    optional string keyName = 2;
    repeated string varStr = 3;
    optional int32 rank = 4;
    optional int32 sex = 11;
    optional int32 lv = 12;
    optional int32 vipLv = 13;
    repeated int32 fashionIds = 14;
    optional string speed = 15;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 16;
    optional int32 serverId = 17;
    optional int32 npcSex = 18;
    optional string familyName = 20;
    optional int32 familyLv = 21;
    optional int32 familyIco = 22;
    optional string patriarchName = 23;
    optional int32 familyMember = 24;
    optional int32 ableJoin = 25;
    optional string familySpeed = 26;
    optional int32 memberNum = 27;
    optional string leaderName = 28;
    optional string leaderPlayerId = 29;
    optional int32 talentId = 41;
    optional bytes data = 42;
}

message MsgRankingData {
    optional RankingGetParam getParam = 1;
    repeated MsgRankingEntryData msgRankingEntryDatas = 2;
    optional int32 index = 3;
    optional bool worship = 4;
    repeated string varStr = 5;
}

message MsgOperateRankHistory {
    optional int32 typeRanking = 1;
    optional string key = 2;
    optional int32 rank = 3;
}

message RankingGetParam {
    optional int32 type = 1;
    optional int32 activityId = 2;
    optional int64 extId = 3;
    optional int32 serverId = 4;
}

message CrossRankNotifyMsg {
    optional string activityName = 1;
    optional int32 activityType = 2;
    optional int32 activityId = 3;
    optional int32 rank = 4;
    optional string name = 5;
    optional int64 fromTime = 6;
    optional bytes data = 7;
    optional int32 templateId = 8;
    optional int32 serverId = 9;
    optional int32 icon = 10;
}

message MsgRankingGame2Cross {
    optional string key = 1;
    optional string value = 2;
    optional int64 rankTime = 3;
    optional int32 lv = 4;
    optional int32 talentId = 5;
}

message MsgRankIndex {
    optional int32 rankType = 1;
    optional int32 index = 2;
}

message MsgGmActivity {
    optional int32 actId = 1;
    optional int32 actType = 2;
    optional int32 actGroup = 3;
}

message MsgRankingDataGame2Cross {
    optional int32 type = 1;
    optional int32 activityId = 2;
    optional int32 groupId = 3;
    optional int64 extId = 4;
    repeated MsgRankingGame2Cross infos = 5;
}

message MsgGetRankIndexParam {
    optional int32 rankType = 1;
    optional string key = 2;
    optional int64 extId = 3;
    optional int32 activityId = 4;
    optional int32 activityType = 5;
    optional int32 serverId = 6;
}

message MsgRankIndexResponse {
    optional MsgGetRankIndexParam param = 1;
    optional int32 rank = 2;
}

message RankingGetReq_12001 {
    optional RankingGetParam params = 1;
}

message RankingGetResp_12001 {
    required int32 ret = 1;
    optional MsgRankingData msgRankingDatas = 2;
}

message RankingWorshipReq_12002 {
    optional int32 type = 1;
}

message RankingWorshipResp_12002 {
    required int32 ret = 1;
    optional int32 worshipId = 2;
    optional int32 type = 3;
}

message CrossRankingGetReq_12003 {
    optional int32 type = 1;
    optional string entryKey = 2;
    optional int32 activityId = 3;
    optional int32 activityGroup = 4;
    optional int64 extId = 5;
}

message CrossRankingGetResp_12003 {
    required int32 ret = 1;
    optional MsgRankingData msgRankingData = 2;
}

message CrossRankingUpdateReq_12004 {
    optional int32 type = 1;
    optional string key = 3;
    optional string initValue = 4;
    optional string addValue = 5;
    optional int32 activityId = 7;
    optional int64 extId = 9;
    optional int32 serverId = 10;
}

message CrossRankingUpdateResp_12004 {
    required int32 ret = 1;
}

message CrossRankStatusReq_12005 {
    optional int32 type = 1;
    optional int32 activityId = 2;
    optional int32 activityGroup = 3;
    optional int64 extId = 4;
}

message CrossRankStatusResp_12005 {
    optional int32 type = 1;
    optional int32 actId = 2;
    optional int32 status = 3;
    repeated MsgOperateRankHistory msgOperateRankHistory = 4;
}

message CrossRankOfServerReq_12006 {
    optional int32 type = 1;
    optional int32 activityId = 2;
    optional int32 activityGroup = 3;
    optional int64 extId = 4;
}

message CrossRankOfServerResp_12006 {
    required int32 ret = 1;
    optional MsgRankingData msgRankingData = 2;
}

message CrossRankNotifyReq_12007 {
    repeated CrossRankNotifyMsg crossRankNotifys = 1;
}

message CrossRankNotifyResp_12007 {
    required int32 ret = 1;
}

message CrossRankingUpdateToGameReq_12008 {
    optional int32 type = 1;
    optional string key = 3;
    optional string value = 5;
    optional int32 activityId = 7;
    optional int32 activityGroup = 8;
    optional int64 extId = 9;
}

message CrossRankingUpdateToGameResp_12008 {
    required int32 ret = 1;
}

message GameServerCrossIdChangeReq_12009 {
    optional int32 type = 1;
    optional int32 gameServerId = 2;
    optional int32 groupId = 3;
    optional int32 groupIdOld = 4;
}

message GameServerCrossIdChangeResp_12009 {
    optional int32 ret = 1;
}

message RankingGetWithoutEntryDataReq_12010 {
