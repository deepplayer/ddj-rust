message ChangeUnionCsRemoteReq_12012 {
    optional MsgGmActivity msgGmActivity = 1;
    optional string playerId = 2;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgCrossFamilyData = 3;
    optional bool isAdd = 4;
    optional bool isDismiss = 5;
}

message CrossRankingUpdateToCrossReq_12013 {
    optional int32 type = 1;
    optional int32 activityId = 2;
    optional int64 extId = 3;
    optional int32 serverId = 4;
    repeated MsgRankingGame2Cross entrys = 21;
    optional MsgRankingGame2Cross topEntry = 22;
}

message CrossRankingUpdateToCrossResp_12013 {
    optional int32 ret = 1;
}

message CrossRankingSyncToCrossReq_12014 {
    optional int32 actType = 1;
    optional int32 activityId = 2;
    optional int32 serverId = 3;
}

message CrossRankingSyncToCrossResp_12014 {
    optional int32 ret = 1;
}

message CrossRankingRemoveReq_12015 {
    optional int32 type = 1;
    optional int32 activityId = 2;
    optional int64 extId = 3;
    optional int32 serverId = 4;
    repeated MsgRankingGame2Cross entrys = 21;
    optional MsgRankingGame2Cross topEntry = 22;
}

message CrossRankingRemoveResp_12015 {
