message MsgStage {
    optional int32 stageId = 1;
    optional int64 endTime = 2;
}

message MsgMatchEnemy {
    optional int32 stageId = 1;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData fromFamily = 2;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData toFamily = 3;
    optional bool isDeploy = 4;
    optional int32 state = 5;
    optional int32 award = 6;
    optional int32 score = 7;
}

message MsgUseTalent {
    optional int32 talentId = 1;
    optional int32 stageId = 2;
}

message MsgPvPReplay {
    optional MsgPvPFamilyBrief fromMsgPvPFamilyBrief = 1;
    optional MsgPvPFamilyBrief toMsgPvPFamilyBrief = 2;
    optional bool bor = 3;
}

message MsgBubbleResult {
    optional int32 stageId = 1;
    optional bool isWin = 2;
    optional string score = 3;
}

message MsgBubbleAward {
    optional int32 stageId = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 2;
}

message MsgPvPFamilyBrief {
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamily = 1;
    repeated MsgPvPTalent msgPvPTalent = 2;
    optional int32 score = 3;
}

message MsgPvPTalent {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional bf.messages.game.TalentMessage.MsgTalentData msgTalent = 2;
    optional bf.messages.game.PetMessage.MsgPetData msgPetData = 3;
    optional int32 itemId = 4;
    optional int32 job = 5;
}

message MsgDeployment {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    repeated bf.messages.game.TalentMessage.MsgTalentData msgTalent = 2;
    optional int32 itemId = 3;
    optional int32 job = 4;
    optional int64 deployTime = 5;
    optional int32 index = 6;
}

message MsgDeployBrief {
    optional string playerId = 1;
    repeated bf.messages.game.CommonBattleMessage.MsgBattleGroup msgGroup = 2;
}

message MsgCsCorrectDeploy {
    optional string playerId = 1;
    repeated MsgCorrectDeploy msgCorrectDeploy = 2;
}

message MsgCorrectDeploy {
    optional int32 stageId = 1;
    repeated bf.messages.game.CommonBattleMessage.MsgBattleGroup msgBattleGroup = 2;
}

message MsgGuessList {
    optional int32 stageId = 1;
    optional int32 state = 2;
    optional bool isGuess = 3;
    optional bool isAward = 4;
    repeated bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamily = 5;
}

message MsgGuessBefore {
    optional int32 stageId = 1;
    repeated int64 familyId = 2;
}

message MsgGuessBrief {
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamily = 1;
    optional string heat = 2;
