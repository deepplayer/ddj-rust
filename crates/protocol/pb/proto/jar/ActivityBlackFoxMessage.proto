message MsgModel {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 fashionId = 2;
    optional int32 playerRank = 3;
    optional int32 familyRank = 4;
    optional int32 mileRank = 5;
    repeated bf.messages.game.TalentMessage.MsgTalentData msgTalent = 6;
    optional string mile = 7;
}

message MsgAreaBrief {
    optional int32 mapId = 1;
    optional int32 peopleCnt = 2;
}

message MsgMapBrief {
    optional int32 mapId = 1;
    optional MsgEvent msgEvent = 2;
    repeated MsgBuff msgBuff = 3;
    repeated int32 talentId = 4;
    repeated bf.messages.game.TalentMessage.MsgTalentData msgTalent = 5;
    repeated bf.messages.game.CommonBattleMessage.MsgMirrorGroup msgMirror = 6;
    repeated MsgEquipment msgEquip = 7;
    repeated MsgGoal msgUpStair = 8;
    optional int32 playerRank = 9;
    optional string playerScore = 10;
    optional int32 familyRank = 11;
    optional string familyScore = 12;
    optional string stone = 13;
    optional int32 totalExploreCnt = 14;
    optional MsgShop msgShop = 15;
}

message MsgEvent {
    optional int32 eventId = 1;
    optional bf.messages.game.ActivityWesternRegionsMessage.MsgEventMonster msgEventMonster = 2;
    optional MsgEventPlayer msgEventPlayer = 3;
}

message MsgShop {
    repeated MsgEventBusinessman msgEventBusinessman = 1;
    optional int32 refreshCnt = 2;
}

message MsgEventBusinessman {
    optional int32 templateId = 1;
    optional int32 buyCnt = 2;
}

message MsgEventPlayer {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgUser = 1;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamily = 2;
    optional int32 imageId = 3;
    optional int32 playerRank = 4;
}

message MsgBuff {
    optional int32 buffId = 1;
    optional int32 restCnt = 2;
}

message MsgEquipment {
    optional int32 equipId = 1;
    optional string equipCnt = 2;
}

message MsgGoal {
    optional int32 monster = 1;
    optional int32 progress = 2;
}

message MsgOneKey {
    optional bool isMonster = 1;
    optional bool isBox = 2;
    optional bool isPlayer = 3;
    optional bool isWish = 4;
    optional bool isBusiness = 5;
    optional bool isUpStair = 6;
}

message MsgBattleResult {
    optional MsgOneKeyResult msgOneKey = 1;
    optional MsgKafkaResult msgKafka = 2;
    optional MsgEvent msgExplore = 3;
}

message MsgOneKeyResult {
    optional int32 eventId = 1;
    optional int32 imageId = 2;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData msgPvPBattleData = 3;
    optional bool isEscape = 4;
    optional bool isAttackAgain = 5;
}

message MsgKafkaResult {
    optional int32 playerRank = 1;
    optional string pScore = 2;
    optional string playerScore = 3;
    optional int32 familyRank = 4;
    optional string fScore = 5;
    optional string familyScore = 6;
    optional string stoneGain = 7;
    optional string stone = 8;
    optional MsgEvent msgEvent = 9;
    repeated MsgEquipment msgEquip = 10;
}

message MsgBattleReport {
    optional int32 mapId = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 2;
    optional int64 timeStamp = 3;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData msgPvPBattleData = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 5;
}

message MsgOutSideMap {
    optional int32 mileRank = 1;
    optional string mile = 2;
    optional bool isEnter = 3;
    repeated MsgModel msgModel = 4;
    repeated MsgOutsideMonster msgMonster = 5;
}

message MsgOutsideMonster {
    optional int32 monsterId = 1;
    optional string hp = 2;
}

message MsgBlackFoxBattleExtra {
    repeated int32 gainBuff = 1;
    repeated MsgFoxBuff msgBuff = 2;
    optional string damage = 3;
    optional string pGain = 4;
    optional string pGainExtra = 5;
    repeated int32 deadTalentId = 6;
    optional string kGain = 7;
    optional string kGainExtra = 8;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResource = 9;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgEquip = 10;
    repeated bf.messages.game.TalentMessage.MsgTalentData msgAfter = 11;
}

message MsgFoxBuff {
    optional string playerId = 1;
