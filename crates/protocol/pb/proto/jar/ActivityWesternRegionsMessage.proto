    optional int32 playerRank = 2;
    optional int32 familyRank = 3;
    repeated MsgTalent msgTalent = 4;
    optional int32 countryId = 5;
}

message MsgEventBusinessman {
    repeated int32 giftId = 1;
}

message MsgTalent {
    repeated int32 updateFieldsList = 99;
    optional int32 talentId = 1;
    optional int32 lv = 2;
    optional int32 degree = 3;
