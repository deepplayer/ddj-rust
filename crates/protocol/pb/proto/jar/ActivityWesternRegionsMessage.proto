    optional int64 timeStamp = 5;
}

message MsgDeclareHist {
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData fromFamily = 1;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData toFamily = 2;
