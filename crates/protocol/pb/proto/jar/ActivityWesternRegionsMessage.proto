    optional MsgEventPlayer msgEventPlayer = 3;
    optional MsgEventBusinessman msgEventBusinessman = 4;
}

message MsgEventMonster {
    optional string curHp = 1;
    optional string maxHp = 2;
    optional bool isFish = 3;
}

