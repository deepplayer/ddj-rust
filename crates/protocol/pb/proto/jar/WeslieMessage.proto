syntax = "proto2";

package bf.messages.game.WeslieMessage;

import "GmActivityMessage.proto";
import "GmActivityCommonMessage.proto";
import "PlayerMessage.proto";
import "CommonMsgMessage.proto";
import "RankingMessage.proto";
import "ActivityMysteryMessage.proto";

message MsgWesliePlayerData {
    optional int32 useImageId = 1;
    optional int32 lv = 2;
    repeated MsgWeslieAttr attr = 4;
    repeated MsgWeslieEquip equip = 5;
    optional int32 buildLv = 6;
    optional int32 charge = 7;
    optional int32 chapter = 8;
    optional int32 stage = 9;
    optional MsgWeslieEquip makeEquip = 10;
    optional int64 fight = 11;
    repeated int32 achievementType = 12;
    optional bf.messages.game.GmActivityCommonMessage.MsgRankPlayerData rankData = 13;
    optional int64 score = 14;
    optional bool bossFreeBattle = 15;
    optional bool redArena = 21;
    optional int32 freeNum = 22;
}

message MsgWeslieSet {
    optional bool fight = 1;
    optional bool attr = 2;
    optional int32 q = 3;
    repeated int32 hight1 = 4;
    repeated int32 hight2 = 5;
}

message MsgWesliePlayerBriefData {
    repeated MsgWeslieEquip equip = 2;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 3;
    optional int32 imageId = 4;
    repeated MsgWeslieAttr attr = 5;
}

message MsgWeslieTemplate {
    repeated MsgWeslieImage images = 1;
    repeated MsgWeslieAchievement achievements = 2;
    repeated MsgWeslieRanklist ranklists = 4;
    repeated bf.messages.game.GmActivityMessage.MsgRank msgRank = 5;
    repeated MsgWeslieEnemy enemy = 6;
}

message MsgWeslieEnemy {
    optional int32 typeid = 1;
    optional string reward1 = 2;
    optional string reward2 = 3;
    optional string reward3 = 4;
    optional int32 rewardNum = 5;
    optional string rewardShow = 6;
    optional bf.messages.game.CommonMsgMessage.MsgResources reward = 7;
}

message MsgWeslieImage {
    optional int32 imageId = 1;
    optional int32 condition = 3;
    optional int32 param = 4;
    optional int32 effect = 5;
}

message MsgWeslieAchievement {
    optional int32 id = 1;
    optional int32 type = 2;
    optional int32 value = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources reward = 4;
}

message MsgWeslieOperateEnemy {
    optional int32 cid = 1;
    optional int32 typeid = 2;
    optional int32 subtype = 3;
    optional string cost = 4;
    optional string reward1 = 5;
    optional string reward2 = 6;
    optional string reward3 = 7;
    optional int32 rewardNum = 8;
    optional string rewardShow = 9;
}

message MsgWeslieRanklist {
    optional int32 rankType = 1;
    optional string rankInterval = 2;
    optional string reward1 = 3;
    optional string reward2 = 4;
}

message MsgWeslieEquip {
    optional int32 id = 1;
    optional int32 lv = 2;
    optional int32 q = 3;
    repeated MsgWeslieAttr attr = 4;
    optional int64 power = 5;
}

message MsgWeslieAttr {
    optional int32 id = 1;
    optional int32 value = 2;
}

message MsgWeslieTransformItem {
    required int32 templateId = 1;
    required int64 num = 2;
    required int64 score = 3;
}

message MsgBattleData {
    optional int32 battleType = 1;
    optional MsgBattleBody fromBody = 2;
    optional MsgBattleBody toBody = 3;
    repeated MsgBattleStep steps = 4;
    optional bool isWin = 5;
    optional int64 fromHp = 6;
    optional int64 toHp = 7;
}

message MsgBattleBody {
    optional bool isRobot = 1;
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 2;
    optional int32 imageId = 3;
    optional int64 hpMax = 4;
    optional int64 hp = 5;
    optional int32 speed = 6;
    optional int32 attack = 7;
    optional int32 defense = 8;
    repeated MsgWeslieAttr specialAttr = 9;
}

message MsgBattleStep {
    optional int32 round = 1;
    optional bool isFrom = 2;
    optional int32 type = 3;
    optional bool isStay = 4;
    optional bool isDodge = 5;
    optional bool isCriticalHit = 6;
    optional int32 hurt = 7;
    optional bool isBlood = 8;
    optional int32 recoveryHp = 9;
    optional bool isStun = 10;
    optional bool isRebound = 11;
    optional int32 reboundHurt = 12;
}

message MsgAreaRankExt {
    optional int32 imageId = 1;
    optional bool isRobot = 2;
}

message MsgAreaEnemy {
    optional int32 playerRank = 1;
    optional bool isRobot = 2;
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 3;
}

message MsgAreaBattleLog {
    optional int32 id = 1;
    optional bool isRobot = 2;
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 3;
    optional bool isAttack = 4;
    optional int32 score = 5;
    optional int64 timeStamp = 6;
    optional bool isWin = 7;
}

message MsgBoss {
    optional int32 bossId = 1;
    optional int64 curHp = 2;
    optional int64 maxHp = 3;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 5;
    repeated bf.messages.game.RankingMessage.MsgRankingEntryData playerRankData = 6;
    optional int64 damage = 9;
    optional int32 playerRank = 10;
    optional int32 energyCnt = 11;
    optional int32 itemCnt = 12;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgKillUse = 13;
    optional int64 killTime = 14;
    optional bool isReward = 15;
}

message MsgBossState {
    optional int32 bossId = 1;
    optional int32 energyCnt = 2;
    optional int32 itemCnt = 4;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 6;
    optional int64 killTime = 7;
    optional bool isReward = 8;
}

