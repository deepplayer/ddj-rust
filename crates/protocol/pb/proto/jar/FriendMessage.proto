syntax = "proto2";

package bf.messages.game.FriendMessage;

import "CommonMsgMessage.proto";

message MsgFriendElement {
    optional string playerId = 1;
    optional string name = 2;
    repeated int32 fashionIds = 3;
    optional int32 sex = 4;
    optional int64 lv = 5;
    optional bool online = 6;
    optional int64 offlineTime = 7;
    optional int32 vipLv = 8;
    optional string family = 9;
    optional string talentAbility = 10;
    optional string buildingAbility = 11;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 12;
    optional int32 familyIco = 13;
    optional string money = 14;
    optional int32 star = 15;
    optional int32 serverId = 16;
    optional MsgCloseFriendElement closeFriendData = 17;
    optional int32 npcSex = 18;
    optional int32 type = 99;
}

message MsgApplysElement {
    optional MsgFriendElement msgFriendElement = 1;
    optional int64 time = 2;
}

message MsgCloseFriendPopup {
    optional string friendId = 1;
    optional int32 popupType = 2;
}

message MsgFriendData {
    repeated MsgApplysElement applys = 1;
    optional bool isAllow = 2;
    repeated string applyId = 3;
    repeated MsgFriendElement frists = 4;
    repeated MsgFriendElement blacks = 5;
    repeated MsgApplysElement closeApplies = 6;
    optional MsgCloseFriendSelfData selfData = 7;
    repeated string updateApplies = 8;
}

message MsgCloseFriendElement {
    optional int64 friendshipPoint = 1;
    optional int32 friendType = 2;
    optional int32 friendStatus = 3;
    optional int64 breakTime = 4;
    repeated MsgCloseFriendLimit friendLimit = 5;
    optional int32 background = 6;
}

message MsgCloseFriendLimit {
    optional int32 friendType = 1;
    optional bool limit = 2;
}

message MsgCloseFriendSeatNum {
    optional int32 closeType = 1;
    optional int32 num = 2;
}

message MsgCloseFriendSelfData {
    repeated MsgCloseFriendSeatNum seatNum = 1;
    repeated int32 gainRewardIds = 2;
    repeated MsgCloseFriendPopup popups = 3;
}

message MsgCloseFriendChatState {
    optional string inviteId = 1;
    optional string playerId = 2;
    optional int32 status = 3;
    optional int32 friendType = 4;
}

message MsgFriendTransferModify {
    optional string toPlayerId = 1;
    optional string oldFromPlayerId = 2;
    optional string newFromPlayerId = 3;
}

message MsgCloseFriendTransferModify {
    optional string toPlayerId = 1;
    optional string oldFromPlayerId = 2;
    optional string newFromPlayerId = 3;
}

