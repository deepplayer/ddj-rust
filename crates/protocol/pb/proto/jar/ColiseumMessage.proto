syntax = "proto2";

package bf.messages.game.ColiseumMessage;

import "CommonMsgMessage.proto";

message MsgColiseumData {
    optional int64 id = 1;
    optional int64 startTime = 2;
    optional int64 endTime = 3;
    optional int64 integral = 5;
    optional int64 maxIntegral = 6;
    optional int32 index = 7;
    repeated int32 grades = 8;
    optional MsgColiseumEntryData toMsgColiseumEntryData = 9;
    repeated int32 talentIds = 10;
    optional MsgColiseumNoticeEntryData msgColiseumNoticeEntryData = 11;
    optional MsgColiseumRankingData lastData = 12;
    optional MsgColiseumEndData msgColiseumEndData = 13;
    optional bool drawAward = 4;
}

message MsgColiseumEntryData {
    optional int32 index = 1;
    optional string playerId = 2;
    optional string name = 3;
    repeated int32 fashionIds = 4;
    optional int32 sex = 5;
    optional int32 lv = 6;
    optional int64 integral = 7;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 8;
    optional string money = 9;
    optional int32 talentNum = 10;
    optional int32 vipLv = 11;
    optional int32 npcSex = 12;
}

message MsgColiseumBattleResultData {
    optional int64 oldIntegral = 1;
    optional int64 newIntegral = 2;
    optional int32 index = 3;
    optional int64 toOldIntegral = 4;
    optional int64 toNewIntegral = 5;
    optional int32 toIndex = 6;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 7;
    optional int32 nowNum = 8;
    optional int32 oldIndex = 9;
    optional int32 toOldIndex = 10;
    optional int32 multiple = 11;
    optional int32 toMultiple = 12;
}

message MsgColiseumNoticeEntryData {
    optional int64 id = 1;
    optional int32 type = 2;
    optional string playerId = 3;
    repeated int32 fashionIds = 4;
    optional int32 sex = 5;
    optional int32 lv = 6;
    optional int32 vipLv = 7;
    optional int64 integral = 8;
    optional string name = 9;
    optional string toName = 10;
    optional int32 winNum = 11;
    optional bool battle = 12;
    optional int64 time = 13;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 14;
    optional int32 npcSex = 15;
}

message MsgColiseumLogEntryData {
    optional int64 id = 1;
    optional string playerId = 2;
    optional string name = 3;
    repeated int32 fashionIds = 4;
    optional int32 sex = 5;
    optional int32 lv = 6;
    optional int32 vipLv = 7;
    optional int32 index = 8;
    optional int64 integral = 9;
    optional string money = 10;
    optional int32 enmity = 11;
    optional int32 winNum = 12;
    optional int64 integralChange = 13;
    optional bool battle = 14;
    optional int64 time = 15;
    optional bool read = 16;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 17;
    optional int32 battleType = 18;
    optional int32 npcSex = 19;
    optional int32 type = 99;
}

message MsgColiseumEndData {
    optional int64 id = 1;
    optional int64 startTime = 2;
    optional int64 endTime = 3;
    optional int32 attackCot = 4;
    optional int64 integral = 5;
    optional int32 index = 6;
    optional MsgColiseumEntryData msgColiseumEntryData = 7;
}

message MsgColiseumRankingData {
    optional int64 id = 1;
    optional int64 startTime = 2;
    optional int64 endTime = 3;
    repeated MsgColiseumEntryData msgColiseumEntryData = 4;
    optional int64 integral = 5;
    optional int32 index = 6;
    optional int64 maxIntegral = 7;
}

message ColiseumMatchingReq_13001 {
}

message ColiseumMatchingResp_13001 {
    required int32 ret = 1;
    optional MsgColiseumData msgColiseumData = 2;
}

message ColiseumGetRankingReq_13002 {
}

message ColiseumGetRankingResp_13002 {
    required int32 ret = 1;
    optional MsgColiseumRankingData nowData = 2;
    optional MsgColiseumRankingData lastData = 3;
}

message ColiseumBattleReq_13003 {
    repeated int32 talentIds = 1;
}

message ColiseumBattleResp_13003 {
    required int32 ret = 1;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData battleData = 2;
}

message ColiseumClearBattleResultReq_13004 {
}

message ColiseumClearBattleResultResp_13004 {
    required int32 ret = 1;
}

message ColiseumLastBattleResultReq_13005 {
}

message ColiseumLastBattleResultResp_13005 {
    required int32 ret = 1;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData battleData = 2;
}

message ColiseumDrawGradeRewardReq_13006 {
    optional int32 grade = 1;
}

message ColiseumDrawGradeRewardResp_13006 {
    required int32 ret = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 2;
}

message ColiseumNoticeGetReq_13007 {
}

message ColiseumNoticeGetResp_13007 {
    required int32 ret = 1;
    repeated MsgColiseumNoticeEntryData datas = 2;
}

message ColiseumLogGetReq_13008 {
}

message ColiseumLogGetResp_13008 {
    required int32 ret = 1;
    repeated MsgColiseumLogEntryData datas = 2;
}

message ColiseumChaseSearchReq_13009 {
    optional string playerId = 1;
}

message ColiseumChaseSearchResp_13009 {
    required int32 ret = 1;
    optional MsgColiseumEntryData msgColiseumEntryData = 2;
}

message ColiseumChaseReq_13010 {
    repeated int32 talentIds = 1;
    optional string playerId = 2;
    optional int64 id = 3;
}

message ColiseumChaseResp_13010 {
    required int32 ret = 1;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData battleData = 2;
    optional int64 id = 3;
}

message ColiseumChallengeReq_13011 {
    repeated int32 talentIds = 1;
    optional int32 type = 2;
    optional int64 id = 3;
}

message ColiseumChallengeResp_13011 {
    required int32 ret = 1;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData battleData = 2;
}

message ColiseumClearEndDataReq_13012 {
}

message ColiseumClearEndDataResp_13012 {
    required int32 ret = 1;
}

message ColiseumLogReadReq_13013 {
    optional int32 type = 1;
    optional int64 id = 2;
}

message ColiseumLogReadResp_13013 {
    required int32 ret = 1;
}

message ColiseumLogOneKeyReadReq_13014 {
    optional int32 type = 1;
}

message ColiseumLogOneKeyReadResp_13014 {
    required int32 ret = 1;
}

message ColiseumDrawAwardReq_13015 {
}

message ColiseumDrawAwardResp_13015 {
    required int32 ret = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 2;
}

message ColiseumDampingGetReq_13016 {
    optional string toPlayerId = 1;
}

message ColiseumDampingGetResp_13016 {
    required int32 ret = 1;
    optional int32 dampingBh = 2;
    optional int32 dampingDw = 3;
}

message ColiseumGetChaseDataReq_13017 {
