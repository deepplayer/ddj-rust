message ColiseumGetChaseDataResp_13017 {
    required int32 ret = 1;
    optional MsgColiseumEntryData msgColiseumEntryData = 2;
}

message ColiseumDoubleChaseReq_13018 {
    repeated int32 talentIds = 1;
    optional string playerId = 2;
    optional int64 id = 3;
    optional int32 cot = 4;
}

message ColiseumDoubleChaseResp_13018 {
    required int32 ret = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgPvPBattleData battleData = 2;
    optional int64 id = 3;
    optional int32 cot = 4;
}

message ColiseumDoubleChallengeReq_13019 {
    repeated int32 talentIds = 1;
    optional int32 type = 2;
    optional int64 id = 3;
    optional int32 cot = 4;
}

message ColiseumDoubleChallengeResp_13019 {
    required int32 ret = 1;
    optional int32 cot = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgPvPBattleData battleData = 3;
}

message ColiseumGetChaseDataListReq_13020 {
}

message ColiseumGetChaseDataListResp_13020 {
    required int32 ret = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgChaseData msgChaseData = 2;
}
