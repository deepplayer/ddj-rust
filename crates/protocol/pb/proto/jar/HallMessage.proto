syntax = "proto2";

package bf.messages.game.HallMessage;

import "CommonMsgMessage.proto";
import "PlayerMessage.proto";

message MsgChannel {
    repeated int32 recently = 1;
    repeated MsgChannelBrief msgBrief = 2;
}

message MsgChannelBrief {
    optional int32 id = 1;
    repeated MsgSubChannel msgSubChannel = 2;
}

message MsgSubChannel {
    optional int32 roomId = 1;
    optional int32 peopleCnt = 2;
    optional int32 friendCnt = 3;
    optional int32 familyCnt = 4;
}

message MsgPlayerBrief {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 useFashion = 2;
    optional int32 state = 3;
    optional int32 posId = 4;
    optional int32 direction = 5;
}

message MsgRoom {
    optional int64 roomId = 1;
    optional int32 gameId = 2;
    repeated MsgSeat msgSeat = 3;
    optional int64 timeStamp = 4;
    optional int64 waitTime = 5;
    optional int32 channel = 6;
    optional int32 peopleCnt = 7;
}

message MsgSeat {
    optional int32 index = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 2;
    optional int32 useFashion = 3;
    optional int32 job = 4;
}

message MsgHsSeat {
    optional int32 hallId = 1;
    optional int32 channel = 2;
    optional int64 roomId = 3;
    repeated MsgSeat msgSeat = 4;
}

message MsgInvite {
    optional string playerId = 1;
    optional int64 timeStamp = 2;
}

message MsgInviteList {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 channel = 2;
    optional int64 roomId = 3;
    optional int32 gameId = 4;
    optional int64 timeStamp = 5;
}

message MsgInviteBrief {
    optional int32 channelId = 1;
    optional int64 roomId = 2;
    optional int32 gameId = 3;
}

message MsgRoomBrief {
    optional MsgInviteBrief msgBrief = 1;
    optional int32 seatCnt = 2;
    optional int32 state = 3;
}

message MsgPlayerMove {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgUser = 1;
    optional int32 beginPosId = 2;
    optional int32 endPosId = 3;
    required int32 direction = 4;
    optional int32 useFashion = 5;
}

message MsgPaintRoom {
    repeated int32 updateFieldsList = 99;
    optional int64 uniqueId = 1;
    repeated MsgPaintSeat msgSeat = 2;
    optional int32 question = 3;
    optional int32 answer = 4;
    optional string drawPlayerId = 5;
    optional int32 state = 6;
    optional int64 timeStamp = 7;
    repeated MsgPicture msgPic = 8;
    optional MsgSettle msgSettle = 9;
    optional bool isEnd = 10;
}

message MsgPaintSeat {
    optional MsgSeat msgSeat = 1;
    optional int32 score = 2;
    optional int32 state = 3;
}

message MsgPicture {
    optional int32 index = 1;
    optional int32 color = 2;
    repeated MsgVector msgVec = 3;
}

message MsgVector {
    repeated int32 posId = 1;
}

message MsgSettle {
    optional int32 choose = 1;
    repeated string correctPlayerId = 2;
    repeated MsgComment msgComment = 3;
}

message MsgComment {
    optional string playerId = 1;
    optional int32 commentId = 2;
}

message MsgGameEnd {
    optional string playerId = 1;
    optional MsgHallGameHead msgHead = 2;
    optional int64 uniqueId = 3;
    optional bool isTask = 4;
}

message MsgHallGameHead {
    optional int32 channelId = 1;
    optional int32 hallId = 2;
    optional int32 channel = 3;
    optional int64 roomId = 4;
    optional int32 gameId = 5;
}

message MsgHallGameContent {
    optional MsgHead msgHead = 1;
    optional bytes data = 2;
    repeated string playerId = 3;
}

message MsgTask {
    optional int32 taskId = 1;
    optional bool isReward = 2;
}

message MsgGameRound {
    optional int32 gameId = 1;
    optional int32 playCnt = 2;
    optional int64 timeStamp = 3;
}

message MsgEndRoom {
    optional string playerId = 1;
    optional MsgRoom msgRoom = 2;
}

message MsgMatchComplete {
    optional int32 channelId = 1;
    optional int32 gameId = 2;
    optional int64 matchId = 3;
    repeated MsgHsSeat msgSeat = 4;
}

message MsgGreedyFishRoom {
    repeated int32 updateFieldsList = 99;
    optional int64 uniqueId = 1;
    repeated MsgGreedyFishPlayerSeat players = 2;
    optional string turnPlayerId = 3;
    optional int64 turnEndTime = 4;
