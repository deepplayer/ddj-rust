syntax = "proto2";

package bf.messages.game.ActivityCardHouseMessage;

import "CommonMsgMessage.proto";
import "GmActivityMessage.proto";
import "PlayerMessage.proto";

message MsgUnlockCard {
    optional int32 cardId = 1;
    optional int32 lv = 2;
}

message MsgCardSet {
    optional int32 index = 1;
    repeated int32 cardId = 2;
    optional bool isUse = 3;
}

message MsgGameStart {
    optional string playerId = 1;
    optional MsgBattleResult msg = 2;
    repeated int32 uniqueId = 3;
    optional string enemyPlayerId = 4;
}

message MsgBattleRecord {
    optional int32 tapeId = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgEnemy = 2;
    optional bool isWin = 3;
    optional int64 timeStamp = 4;
}

message MsgBattleField {
    repeated MsgHand first = 1;
    repeated MsgHand second = 2;
    repeated MsgBoard msgBoard = 3;
}

message MsgHand {
    optional int32 indexOfHand = 1;
    optional MsgCard msgCard = 2;
    repeated MsgEffect msgBuff = 3;
}

message MsgCard {
    optional int32 uniqueId = 1;
    repeated MsgDice msgDice = 2;
}

message MsgBoard {
    optional int32 posId = 1;
    optional MsgCardOfBoard msgCard = 2;
}

message MsgCardOfBoard {
    optional MsgCard msgCard = 1;
    optional bool isOffensive = 2;
    repeated MsgEffect msgSkill = 3;
    repeated MsgEffect msgBuff = 4;
}

message MsgEffect {
    optional int32 templateId = 1;
    optional int32 effectCnt = 2;
}

message MsgBattleResult {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgFirst = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgSecond = 2;
    optional MsgBattleField initBattleField = 3;
    repeated MsgBattleTurn msgBattleTurn = 4;
    optional int64 startTime = 5;
}

message MsgBattleTurn {
    required int32 round = 1;
    repeated MsgWarSituation msgWar = 2;
    optional int64 thinkingTime = 3;
}

message MsgWarSituation {
    optional int32 type = 1;
    optional bytes data = 2;
}

message MsgWarSituationType1 {
    optional int32 indexOfHand = 1;
    optional int32 posId = 2;
    optional MsgCardOfBoard msgCard = 3;
}

message MsgWarSituationType2 {
    repeated MsgBuffActive msgBuff = 1;
}

message MsgBuffActive {
    optional MsgBuff msgBuff = 1;
    optional MsgEffect msgCorrelation = 2;
}

message MsgWarSituationType3 {
    optional int32 posId = 1;
    optional int32 skillId = 2;
    optional bytes data = 3;
}

message MsgTypeSkill12 {
    repeated MsgPositionChange msgChange = 1;
}

message MsgPositionChange {
    optional int32 formerPosId = 1;
    optional int32 latterPosId = 2;
}

message MsgTypeSkill13 {
    repeated MsgHand msgEnemy = 1;
}

message MsgTypeSkill21 {
    optional int32 enemyPosId = 1;
}

message MsgTypeSkill33 {
    optional int32 enemyPosId = 1;
}

message MsgWarSituationType4 {
    repeated MsgFightSegmentation msgFightSegmentation = 1;
}

message MsgWarSituationType5 {
    optional int32 posId = 1;
}

message MsgWarSituationType7 {
    optional int32 posId = 1;
    repeated int32 skillId = 2;
}

message MsgWarSituationType8 {
    optional int32 posId = 1;
    repeated MsgEffect msgBuff = 2;
}

message MsgFightSegmentation {
    optional MsgDirection msgAtk = 1;
    optional MsgDirection msgDef = 2;
}

message MsgDirection {
    optional int32 posId = 1;
    optional int32 direction = 2;
}

message MsgDice {
    optional int32 direction = 1;
    optional int32 dice = 2;
}

message MsgBuff {
    optional int32 posId = 1;
    optional int32 buffId = 2;
}

message MsgCompetitor {
    optional string playerId = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgEnemy = 2;
    optional bool isWin = 3;
    optional bool isOffensive = 4;
}

message MsgNotify {
    optional string enemyName = 1;
    optional bool isWin = 2;
    optional string score = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 4;
}

message MsgSettle {
    optional int32 stageId = 1;
    optional string score = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgTitle = 4;
}

message MsgSeat {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 1;
    optional int32 title = 2;
    optional bool isOwner = 3;
    optional bool isReady = 4;
}

message MsgInviteHist {
    optional string playerId = 1;
    optional int64 endTime = 2;
}

message MsgCardHouseInvite {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 1;
    optional int64 endTime = 2;
}

