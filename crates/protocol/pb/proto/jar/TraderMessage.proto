syntax = "proto2";

package bf.messages.game.TraderMessage;

import "GmActivityCommonMessage.proto";
import "GmActivityMessage.proto";
import "CommonMsgMessage.proto";
import "RankingMessage.proto";

message MsgTraderPlayerData {
    repeated int32 achievementId = 1;
    optional bf.messages.game.GmActivityCommonMessage.MsgRankPlayerData rankData = 2;
    optional int32 travelTimes = 3;
    repeated MsgTraderJewllery msgJewllery = 4;
    optional int64 money = 5;
    optional int64 allMoney = 6;
    optional int64 historyAllMoney = 7;
    optional int32 reputation = 8;
    optional int32 rTitleId = 9;
    optional int32 mTitleId = 10;
    optional int32 energy = 11;
    optional int32 id = 12;
    optional int32 age = 13;
    optional int32 eventId = 14;
    repeated MsgTraderJewllery gameJewllery = 15;
    repeated MsgTraderMine estate = 16;
    repeated MsgTraderTitle title = 17;
}

message MsgTraderTemplate {
    repeated MsgTraderReward reward = 1;
    repeated bf.messages.game.GmActivityMessage.MsgRank msgRank = 2;
    repeated MsgTraderEstate estate = 3;
    repeated MsgTraderStore store = 4;
    repeated MsgTraderJewellerylevel jewellerylevel = 5;
}

message MsgTraderReward {
    optional int32 taskId = 1;
    optional string param1 = 3;
    optional string reward = 4;
    optional int32 typeReward = 5;
}

message MsgTraderJewllery {
    optional int32 id = 1;
    optional int32 lv = 2;
}

message MsgTraderGoods {
    optional int32 id = 1;
    optional int32 price = 2;
    optional int32 num = 3;
    optional int64 sid = 4;
}

message MsgTraderLog {
    optional int32 type = 1;
    optional int64 value = 2;
}

message MsgTraderCareer {
    optional int32 age = 1;
    optional int32 type = 2;
    optional int32 param = 3;
}

message MsgTraderMine {
    optional int32 id = 1;
    optional bool state = 4;
    optional int32 total = 5;
    optional int32 mineSpeed = 6;
    repeated int32 risk = 7;
    optional bool buyState = 8;
    optional int32 earnings = 9;
    optional int32 exemp = 10;
}

message MsgTraderBank {
    repeated MsgTraderBankPrice price = 1;
    optional int32 curPrice = 2;
    optional int32 buyPrice = 3;
    optional int32 state = 4;
    optional int32 id = 5;
    optional int32 buyNum = 6;
}

message MsgTraderBankPrice {
    optional int64 time = 1;
    optional int32 curPrice = 2;
}

message MsgTraderTravel {
    optional int32 type = 1;
    optional int32 value = 2;
}

message MsgTraderTravelZhenBao {
    optional int32 id = 1;
    optional int64 npcBid = 2;
    optional int64 money = 3;
    optional int64 allCostMoney = 4;
    optional bool tf = 5;
    optional int32 num = 6;
}

message MsgTraderEstate {
    optional int32 sid = 1;
    optional int32 type = 2;
    optional int32 price = 3;
    optional int32 total = 4;
    optional int32 risk = 5;
    optional int32 univalent = 6;
    optional int32 max = 7;
    optional int32 tid = 8;
    optional int32 buyNum = 9;
    optional int32 ticketNum = 10;
}

message MsgTraderStore {
    optional int32 sid = 1;
    optional int32 originPrice = 2;
    optional string commonPrice = 3;
    optional string bigDrop = 4;
    optional string bigRise = 5;
}

message MsgTraderJewellerylevel {
    optional int32 sid = 1;
    optional int32 pid = 2;
    optional int32 level = 3;
    optional string consume = 4;
    optional int32 type = 5;
    optional int32 number = 6;
}

message MsgTraderTitle {
    optional int32 titleId = 1;
    optional int32 num = 2;
}

message MsgTraderMineExempt {
    optional int32 id = 1;
    optional int32 exemptNum = 2;
}

message TraderUpdatePushResp_39601 {
    optional int32 titleId1 = 2;
    optional int32 travelTimes = 3;
    optional int64 money = 4;
    optional int64 allMoney = 5;
    optional int32 energy = 6;
    optional int32 reputation = 7;
    optional int32 titleId2 = 8;
    repeated MsgTraderTitle title = 9;
}

message TraderJewlleryUpgradeReq_39602 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    optional int32 id = 2;
}

message TraderJewlleryUpgradeResp_39602 {
    required int32 ret = 1;
    optional MsgTraderJewllery msgJewllery = 2;
}

message TraderShopDealReq_39603 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
    optional int32 id = 2;
    optional int32 num = 3;
    optional int64 sid = 4;
    optional bool sell = 5;
}

message TraderShopDealResp_39603 {
    optional bool sell = 1;
    optional int32 id = 2;
    optional int32 num = 3;
    optional int64 money = 4;
    optional int64 sid = 5;
    required int32 ret = 6;
}

message TraderGameStartReq_39604 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
}

message TraderGameStartResp_39604 {
    required int32 ret = 1;
    optional int32 id = 2;
    repeated MsgTraderJewllery gameJewllery = 3;
}

message TraderGameNextReq_39605 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
}

message TraderGameNextResp_39605 {
    required int32 ret = 1;
    repeated MsgTraderLog costLog = 2;
    repeated MsgTraderLog addLog = 3;
    repeated MsgTraderGoods msgShop = 4;
    optional int32 energy = 5;
    optional int64 birthFeast = 6;
    optional int32 eventId = 7;
    optional int32 travelTime = 8;
    repeated int32 mineClose = 9;
    optional int32 age = 10;
    repeated int32 mineOver = 11;
    repeated MsgTraderMineExempt exemp = 12;
}

message TraderGameEndReq_39606 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
}

message TraderGameEndResp_39606 {
    required int32 ret = 1;
    repeated MsgTraderCareer msgCareer = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources reward = 3;
}

message TraderGetShopReq_39609 {
    required bf.messages.game.GmActivityMessage.MsgGmActivity msgGmActivity = 1;
}

message TraderGetShopResp_39609 {
    optional int32 maxNum = 2;
    repeated MsgTraderGoods msgShop = 3;
    repeated MsgTraderGoods msgWarehouse = 4;
    optional int32 upgradeTime = 5;
    required int32 ret = 6;
}

message TraderWarehouseUpgradeReq_39610 {
