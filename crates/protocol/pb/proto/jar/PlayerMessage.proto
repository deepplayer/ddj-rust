    optional int32 crossId = 28;
    optional int32 adRewardTimes = 29;
    optional int32 wealRewardStatus = 30;
    optional string maxMoneySpeed = 31;
    optional int32 mammonType = 32;
    optional int64 vvipNoticeTime = 33;
    optional int64 sumRmbReal = 34;
    optional int32 talentResetTimes = 35;
    optional string maxMoney = 36;
    optional bool haveMammon = 37;
    optional string mammonDec = 38;
    optional bool openVVip = 39;
