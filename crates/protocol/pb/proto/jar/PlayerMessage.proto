    optional string name = 2;
    repeated int32 fashionIds = 3;
    optional int32 sex = 4;
    optional int64 exp = 5;
    optional int32 lv = 6;
    optional int64 jewel = 7;
    optional string money = 8;
    optional int32 updateNameCot = 9;
    optional bool drawEveryday = 10;
    optional int32 vip = 11;
    optional int32 vipExp = 12;
    optional int32 npcSex = 13;
