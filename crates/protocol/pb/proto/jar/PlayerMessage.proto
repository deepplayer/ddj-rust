    optional string slgDec = 46;
    optional string wechatImg = 47;
    optional int32 PartnerSex = 48;
    optional int64 createTime = 49;
    repeated PlayerCacheTemp playerCacheTemp = 99;
}

message MsgOtherPlayer {
    optional string playerId = 1;
    optional string name = 2;
    repeated int32 fashionIds = 3;
    optional int32 sex = 4;
    optional int64 lv = 5;
    optional int32 npcSex = 6;
    optional int32 vipLv = 8;
    optional string family = 9;
    optional string talentAbility = 10;
    optional string buildingAbility = 11;
    optional int32 stage = 12;
    optional int32 talentNum = 13;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 15;
    optional int32 petNum = 16;
    repeated int32 titles = 17;
    optional int32 serverId = 18;
    optional string mammonDec = 19;
    optional int32 familyIco = 20;
    optional bool friendScope = 21;
}

message MsgOtherPlayerDetail {
    optional MsgOtherPlayer playerData = 1;
    repeated bf.messages.game.TalentMessage.MsgTalentData talentData = 2;
    repeated bf.messages.game.PetMessage.MsgPetData petData = 3;
}

message MsgOfflinePet {
    optional int32 id = 1;
    optional int32 skinId = 2;
}

message MsgOfflinePlayer {
    repeated int32 updateFieldsList = 90;
    optional string playerId = 1;
    repeated int32 fashionIds = 2;
    optional int32 lv = 3;
    optional int32 sex = 4;
    optional int32 vipLv = 5;
    optional int32 vipExp = 6;
    optional int64 logoutDateTime = 7;
    optional int32 npcSex = 8;
    optional string name = 9;
    optional string moneySpeed = 10;
    repeated MsgOfflinePet pets = 11;
    optional int32 cityId = 12;
    optional int64 familyId = 13;
    optional string money = 14;
    optional string manifesto = 15;
    optional int32 serverId = 16;
    repeated int32 petSeniorIds = 17;
    optional string familyName = 18;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 19;
    optional string slgDec = 20;
    optional int32 familyIco = 21;
    optional bool online = 22;
    optional bool isReborn = 23;
    optional string topSlgDec = 24;
}

message MsgCrossUser {
    repeated int32 updateFieldsList = 90;
    optional string playerId = 1;
    repeated int32 fashionIds = 2;
