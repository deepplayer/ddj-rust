syntax = "proto2";

package bf.messages.game.FortuneMessage;

import "CommonMsgMessage.proto";

message MsgActivateRecord {
    optional int32 type = 1;
    optional int32 id = 2;
    optional int32 gtimes = 3;
    optional int32 addFortune = 4;
}

message MsgFortune {
    optional int64 time = 1;
    repeated MsgActivateRecord msgActivateRecord = 2;
}

message MsgPlayerData {
    optional string id = 1;
    optional string name = 2;
    optional int32 sex = 3;
    optional int32 lv = 4;
    repeated int32 fashionIds = 5;
    optional int64 familyId = 6;
    optional string familyName = 7;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 8;
    optional int32 serverId = 9;
    optional string declare = 10;
    optional int64 activateTime = 11;
    optional int32 vip = 12;
    optional int32 npcSex = 13;
}

message MsgHistoryItem {
    optional string id = 1;
    optional string name = 2;
    optional int32 sex = 3;
    optional int32 lv = 4;
    repeated int32 fashionIds = 5;
    optional int64 familyId = 6;
    optional string familyName = 7;
    optional string familyIco = 8;
    optional int64 activeTime = 9;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 10;
    optional int32 serverId = 11;
    optional int32 vip = 12;
    optional int32 npcSex = 13;
}

message MsgFortuneEndTime {
    optional int32 id = 1;
    optional int64 endTime = 2;
}

message MsgToCrossMammondData {
    optional string playerId = 1;
    optional int64 activateTime = 2;
    optional int64 endTime = 3;
    optional int32 groupId = 4;
    optional int32 mammonId = 5;
}

message MsgFortuneResp_23001 {
    optional MsgActivateRecord msgActivateRecord = 1;
}

message MsgPlayerListReq_23002 {
    optional int32 id = 1;
}

message MsgPlayerListResp_23002 {
    required int32 ret = 1;
    optional int32 id = 2;
    repeated MsgPlayerData players = 3;
}

message MsgWorshipReq_23003 {
}

message MsgWorshipResp_23003 {
    required int32 ret = 1;
    optional int64 time = 2;
}

message MsgFortuneEndTimeReq_23005 {
}

message MsgFortuneEndTimeResp_23005 {
    required int32 ret = 1;
    repeated MsgFortuneEndTime endTime = 2;
}

message MsgFortuneGetReq_23006 {
}

message MsgFortuneGetResp_23006 {
    required int32 ret = 1;
    optional MsgFortune msgFortune = 2;
}

message MsgFortuneReloadReq_23012 {
    optional int32 type = 1;
    repeated int32 mammonId = 2;
    optional int32 serverId = 3;
    optional string playerId = 4;
}

message MsgFortuneReloadResp_23012 {
    required int32 ret = 1;
}

message MsgPlayerTempleInfo {
    optional int64 time = 1;
    optional bool isOpne = 2;
}

message MsgSetUpTheTempleReq_23100 {
    optional string playerId = 1;
    optional int32 id = 2;
}

message MsgSetUpTheTempleResp_23100 {
    required int32 ret = 1;
    optional MsgTemplePlayerInfo templeInfo = 2;
}

message MsgTemplePlayerListReq_23101 {
}

message MsgTemplePlayerListResp_23101 {
    required int32 ret = 1;
    repeated MsgTemplePlayerInfo templeInfo = 2;
    optional int64 worshipNum = 3;
    repeated MsgTempleFamilyInfo histortyInfo = 4;
    repeated MsgSlgPlayerInfo msgSlgPlayerInfo = 5;
    optional int32 worshipServerId = 6;
    optional int64 firstFamilId = 7;
    optional string familyName = 8;
    optional int32 familyIco = 9;
    optional int64 time = 10;
}

message MsgTemplePlayerInfo {
    optional int32 id = 1;
    optional MsgPlayerData players = 2;
    optional int64 updateTime = 3;
}

message MsgTempleFamilyInfo {
    optional string playerName = 1;
    optional string familyName = 2;
    optional int32 familyIco = 3;
    repeated int32 joinInfo = 4;
    optional int64 histortyWorshipNum = 5;
    optional int64 endTime = 6;
    optional int32 familyServer = 7;
}

message MsgTempleWorshipReq_23102 {
}

message MsgTempleWorshipResp_23102 {
    required int32 ret = 1;
    optional int64 time = 2;
    optional int64 worshipNum = 3;
}

message MsgSlgAllInfoReq_23103 {
    optional int32 worshipServerId = 1;
    optional int64 firstFamilId = 2;
    repeated MsgSlgPlayerInfo msgSlgPlayerInfo = 3;
    optional int32 activityId = 4;
    optional string playerName = 5;
    optional string familyName = 6;
    optional int32 familyIco = 7;
    repeated int32 joinInfo = 8;
}

message MsgSlgPlayerInfo {
    optional string playerId = 1;
    optional int64 value = 2;
}

message MsgTopSlgPlayerInfo {
    optional string playerId = 1;
    optional int64 value = 2;
}

message MsgG2GQueryTempleInfoReq_23104 {
}

message MsgG2GQueryTempleInfoResp_23104 {
    repeated MsgTemplePlayerInfo templeInfo = 1;
}

message MsgTopSlgAllInfoReq_23105 {
    optional int32 worshipServerId = 1;
    optional int64 firstFamilId = 2;
    repeated MsgTopSlgPlayerInfo msgTopSlgPlayerInfo = 3;
    optional int32 activityId = 4;
    optional string playerName = 5;
    optional string familyName = 6;
    optional int32 familyIco = 7;
    repeated int32 joinInfo = 8;
}

message MsgKirinGetReq_23201 {
}

message MsgKirinGetResp_23201 {
    required int32 ret = 1;
    optional int64 time = 2;
}

message MsgKirinWorshipReq_23202 {
}

message MsgKirinWorshipResp_23202 {
    required int32 ret = 1;
    optional int64 time = 2;
}

message MsgPlayerListReq_23203 {
}

message MsgPlayerListResp_23203 {
    required int32 ret = 1;
    repeated MsgPlayerData players = 2;
}

message MsgSetKirinDeclareReq_23204 {
    optional string dec = 1;
}

message MsgSetKirinDeclareResp_23204 {
    required int32 ret = 1;
    optional string dec = 2;
}

message MsgKirin {
    optional int64 time = 1;
    repeated MsgPlayerData players = 2;
}
