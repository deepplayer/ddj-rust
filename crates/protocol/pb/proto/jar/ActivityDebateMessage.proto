message MsgMapData {
    optional int64 familyId = 1;
    optional int32 serverId = 2;
    optional string familyName = 3;
    optional int32 restPeople = 4;
    optional int32 totalPeople = 5;
    optional bool isLose = 6;
    optional string totalMoney = 7;
    optional int32 lastRank = 8;
    optional int32 rank = 9;
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer msgOfflinePlayer = 10;
}

message MsgFamilyMember {
    optional int32 rank = 1;
    optional string playerId = 2;
    optional string playerName = 3;
    optional int32 pos = 4;
    optional string score = 5;
    optional bool isLose = 6;
}

message MsgEnemy {
    optional int32 index = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgOfflinePlayer = 2;
    optional string score = 3;
    optional int32 rank = 4;
}

message MsgDebateBattleExtra {
    repeated bool isInitiate = 1;
    repeated bool isWin = 2;
    optional int32 scoreOfMine = 3;
    optional int32 scoreOfEnemy = 4;
    optional int32 fromRank = 5;
    optional string fromScore = 6;
    optional int32 toRank = 7;
    optional string toScore = 8;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 9;
}

message MsgDefenceHist {
    optional bool isAttack = 1;
    optional string playerId = 2;
    optional string name = 3;
    optional int32 serverId = 4;
    optional int32 sex = 5;
    repeated int32 fashionIds = 6;
    optional int32 vipLv = 7;
    optional bool isWin = 8;
    optional int32 score = 9;
    optional int64 timeStamp = 10;
    optional bf.messages.game.CommonMsgMessage.MsgPvPBattleData msgPvPBattleData = 11;
    optional int32 npcSex = 12;
}

message MsgDefenceTalent {
    optional bf.messages.game.TalentMessage.MsgTalentData msgTalentData = 1;
    optional bf.messages.game.PetMessage.MsgPetData msgPetData = 2;
}

message MsgSyncDefence {
    optional string playerId = 1;
    repeated MsgDefenceTalent msgDefenceTalent = 2;
}

message MsgSelfRank {
    optional int32 actId = 1;
    optional int32 actType = 2;
    optional int32 pRank = 3;
    optional string pScore = 4;
    optional int32 pState = 5;
    optional int32 fRank = 6;
    optional string fScore = 7;
    optional int32 fState = 8;
}

message MsgDefence {
    optional int32 index = 1;
    repeated int32 talentId = 2;
}

