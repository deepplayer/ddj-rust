message MsgChenXiangAllTemplateData {
    repeated bf.messages.game.GmActivityCommonMessage.MsgRankReward rankRewards = 1;
    repeated MsgChenXiangEventTemplateData events = 2;
    repeated MsgTaskRewardTemplate rewards = 3;
    repeated MsgImageTemplate images = 4;
    repeated MsgArenaRankRewardTemplate arenas = 5;
}

message MsgChenXiangEventTemplateData {
    optional int32 eventId = 1;
    optional int32 eventType = 2;
    optional int32 setype = 3;
    optional string integralReward = 4;
    optional int32 rewardQuantity = 6;
    optional int32 latticeReward = 7;
    optional string rewardPreview = 10;
}

message MsgTaskRewardTemplate {
    optional int32 id = 1;
    optional int32 region = 2;
    optional string reward = 3;
}

message MsgImageTemplate {
    optional int32 id = 1;
    optional int32 condition = 2;
