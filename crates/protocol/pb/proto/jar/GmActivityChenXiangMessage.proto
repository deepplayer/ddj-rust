}

message MsgArenaRankRewardTemplate {
    optional string rankInterval = 1;
    optional int32 rankType = 2;
    optional string reward1 = 3;
    optional string reward2 = 4;
}

message MsgChenXiangPlayerData {
    repeated int32 updateFieldsList = 99;
    optional bf.messages.game.GmActivityCommonMessage.MsgRankPlayerData rankData = 1;
    repeated int32 gainTaskId = 2;
    optional int32 totalChargeNum = 3;
    optional bool isStartGame = 4;
    optional bool newEventLog = 5;
    optional int32 lockChargeNum = 6;
    optional int32 fashionId = 7;
    optional bool redArena = 8;
    optional int32 freeNum = 9;
    repeated MsgTalent talents = 11;
    optional int32 recoverHpCount = 13;
    optional int32 buffItem = 14;
    optional int32 buffBattle = 15;
    optional string baseHp = 16;
    optional int32 areaId = 21;
    repeated MsgMapCell cells = 22;
    optional int32 curPos = 25;
    optional int32 tarPos = 26;
    optional MsgTrapData trapData = 27;
}

message MsgTalent {
    optional int32 talentId = 1;
    optional string hp = 2;
    optional string surplusHp = 3;
    optional int32 equipLv = 4;
    optional string origMoney = 5;
}

message MsgMapCell {
    optional int32 pos = 1;
    optional int32 eventId = 2;
    optional int32 eventType = 3;
    optional MsgMapNpc npcEvent = 6;
}

message MsgMapNpc {
    repeated MsgTalent talents = 1;
}

message MsgTrapData {
    optional bool isTrap = 1;
    optional int64 trapEndTime = 2;
    optional int64 trapHelpEndTime = 3;
}

message MsgTrapHelp {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 1;
    optional int64 time = 2;
}

message MsgEventLog {
    optional int32 type = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources rewards = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources extraRewards = 3;
    optional string killPlayerName = 6;
    optional string helpTrapPlayerName = 7;
}

message MsgBattleResultExtra {
    optional int32 eventId = 1;
    repeated string fromSurplusHp = 2;
    repeated string toSurplusHp = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources reward = 5;
    repeated bf.messages.game.CommonMsgMessage.MsgResources extraReward = 6;
    optional bool haveBuff = 7;
}

message MsgAutoPlayParam {
    optional int32 actionType = 1;
    repeated int32 eventSorts = 2;
    optional int32 recoveryType = 3;
    optional int32 wishType = 4;
    optional bool firstNpc = 5;
    optional int32 trapType = 6;
}

message MsgAutoPlayEventResult {
    optional int32 type = 1;
    optional int32 count = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources rewards = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources extRewards = 4;
    repeated int32 wishType = 6;
    optional int32 recoveryNum = 7;
    optional bf.messages.game.CommonMsgMessage.MsgResources cost = 5;
    optional int32 trapCostNum = 8;
}

message MsgRankExt {
