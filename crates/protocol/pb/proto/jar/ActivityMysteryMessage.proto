syntax = "proto2";

package bf.messages.game.ActivityMysteryMessage;

import "ActivityWesternRegionsMessage.proto";
import "CommonMsgMessage.proto";
import "FamilyMessage.proto";
import "FestivalMessage.proto";
import "GmActivityMessage.proto";
import "PetMessage.proto";
import "PlayerMessage.proto";
import "RankingMessage.proto";
import "TalentMessage.proto";

message MsgPass {
    optional int32 lv = 1;
    optional bool isFree = 2;
    optional bool isPay = 3;
}

message MsgAchievement {
    optional int32 templateId = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 2;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamilyData = 3;
    optional bool isGet = 4;
}

message MsgMapData {
    repeated int32 updateFieldsList = 99;
    optional int32 floor = 1;
    repeated int32 markPosId = 2;
    repeated MsgCompleteEvent msgCompleteEvent = 3;
    repeated int32 fog = 4;
    repeated MsgMapBrief msgMapBrief = 5;
    repeated MsgPlayerBrief msgPlayerBrief = 6;
    optional MsgNextFloor msgNextFloor = 7;
    optional bool isNextFloor = 8;
}

message MsgEvent {
    repeated int32 updateFieldsList = 99;
    optional int32 eventId = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 2;
    optional int64 lastShareTime = 3;
    optional bool isMark = 4;
    optional MsgNatural msgNatural = 5;
    optional MsgBusinessman msgBusinessman = 6;
    optional MsgMonster msgMonster = 7;
    optional MsgShop msgShop = 8;
}

message MsgNatural {
    optional int32 collectCnt = 4;
}

message MsgBusinessman {
    repeated MsgGoods msgGoods = 1;
}

message MsgGoods {
    optional int32 templateId = 1;
    optional int32 submitCnt = 2;
}

message MsgMonster {
    optional string curHp = 1;
    optional string maxHp = 2;
    optional int32 robScore = 3;
}

message MsgShop {
    repeated int32 updateFieldsList = 99;
    repeated int32 templateId = 1;
    optional int32 buy = 2;
}

message MsgCompleteEvent {
    optional int32 eventType = 1;
    optional int32 count = 2;
}

message MsgMapBrief {
    optional int32 posId = 1;
    optional MsgEvent msgEvent = 2;
    optional int32 fieldType = 3;
    optional bool isComplete = 4;
}

message MsgPlayerBrief {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 fashionId = 2;
    optional int32 beginPosId = 3;
    optional int32 endPosId = 4;
    optional int32 direction = 5;
    optional int64 timeStamp = 6;
}

message MsgBoss {
    optional int32 bossId = 1;
    optional string curHp = 2;
    optional string maxHp = 3;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamilyData = 4;
    repeated bf.messages.game.RankingMessage.MsgRankingEntryData msgRankingEntryDatas = 5;
    optional int32 playerRank = 6;
    optional string damage = 7;
    optional string money = 8;
    optional int32 energyCnt = 9;
    optional int64 energyTime = 10;
    optional int32 itemCnt = 11;
    optional int64 itemTime = 12;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 13;
    optional int64 killTime = 14;
    optional bool isReward = 15;
}

message MsgBossState {
    optional int32 bossId = 1;
    optional int32 energyCnt = 2;
    optional int64 energyTime = 3;
    optional int32 itemCnt = 4;
    optional int64 itemTime = 5;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 6;
    optional int64 killTime = 7;
    optional bool isReward = 8;
}

message MsgTalent {
    repeated int32 updateFieldsList = 99;
    optional int32 talentId = 1;
    optional int32 lv = 2;
    optional int32 useSkinId = 3;
    optional int32 skinAwaken = 4;
    optional string money = 5;
    optional int32 state = 6;
}

message MsgEquip {
    optional int32 templateId = 1;
    optional int32 lv = 2;
}

message MsgEquipChip {
    optional int32 templateId = 1;
    optional int64 num = 2;
}

message MsgReport {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 1;
    optional int32 floor = 2;
    optional int32 posId = 3;
    optional int32 eventId = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgResources = 5;
    optional int64 timeStamp = 6;
}

message MsgNextFloor {
    optional string playerId = 1;
