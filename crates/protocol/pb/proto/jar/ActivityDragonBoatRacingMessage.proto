message MsgDragonBoatRacingActivity {
    repeated bf.messages.game.GmActivityMessage.MsgRank msgRank = 1;
    repeated MsgDragonBoatTime msgTime = 2;
    repeated MsgDragonBoatReward msgReward = 3;
    repeated MsgDragonBoatPay msgPay = 4;
    repeated MsgDragonBoatGamble msgGamble = 5;
}

message MsgDragonBoatTime {
    optional int32 actId = 1;
    optional int32 onlyId = 2;
    optional int32 timeType = 3;
    optional int32 beginTime = 4;
    optional int32 endTime = 5;
    optional int32 typeParam = 6;
    optional string rankListParam = 7;
    optional string shopTab = 8;
}

message MsgDragonBoatReward {
    optional int32 actId = 1;
    optional int32 winNum = 2;
    optional string reward = 3;
    optional int32 integral = 4;
}

message MsgDragonBoatPay {
    optional int32 actId = 1;
    optional int32 onlyId = 2;
    optional int32 payMan = 3;
    optional string reward = 4;
}

message MsgDragonBoatGamble {
    optional int32 actId = 1;
    optional int32 gambleId = 2;
    optional string gambleReward = 3;
    optional int32 hot = 4;
}

message MsgDragonBoatRacingEntrance {
    optional bool isGuess = 1;
    optional bool isGuessAward = 2;
    optional bool isJoin = 3;
    optional bool isDeploy = 4;
    optional bool isSpeed = 5;
    optional bool isChargeAward = 6;
    repeated bf.messages.game.GmActivityMessage.MsgRankAwardState rankState = 7;
}

message MsgPanel {
    optional int32 stageId = 1;
    optional int32 familyRank = 2;
    optional string familyScore = 3;
    optional bool isPromote = 4;
    optional bool isMember = 5;
    optional int32 freeCnt = 6;
    optional int32 refreshCnt = 7;
    optional int32 playerRank = 8;
    repeated int32 talentId = 9;
    optional bool isBattle = 10;
    optional int32 realRank = 11;
    optional int32 deployCnt = 12;
    repeated MsgAcceleration msgSelf = 13;
    optional int32 speed = 14;
    optional bool isAutoSpeedUp = 15;
}

message MsgChargePanel {
    optional int32 chargeCnt = 1;
    optional int32 totalCnt = 2;
    repeated MsgChargeBrief msgBrief = 3;
}

message MsgChargeBrief {
    optional int32 templateId = 1;
    optional int32 receiveCnt = 2;
    optional bool isGet = 3;
}

message MsgExercise {
    optional int32 lv = 1;
    repeated MsgExerciseBrief msgBrief = 2;
    optional int32 memberCnt = 3;
}

message MsgExerciseBrief {
    optional int32 templateId = 1;
    optional int32 lv = 2;
    optional int32 exp = 3;
    optional int32 jewelCnt = 4;
    optional int64 lastJewelTime = 5;
}

message MsgSysDeploy {
    optional int32 stageId = 1;
    repeated bf.messages.game.CommonBattleMessage.MsgBattleGroup msgBattleGroup = 2;
}

message MsgSelfDeploy {
    optional int32 stageId = 1;
    repeated int32 talentId = 2;
}

message MsgGsSelfDeploy {
    optional int32 stageId = 1;
    repeated bf.messages.game.CommonBattleMessage.MsgBattleGroup msgBattleGroup = 2;
}

message MsgFamilyDeploy {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgUser = 1;
    repeated bf.messages.game.TalentMessage.MsgTalentData msgTalent = 2;
}

message MsgBattleField {
    optional int32 stageId = 1;
    optional int64 endTime = 2;
    optional int32 groupId = 3;
    optional int32 groupCnt = 4;
    repeated MsgDragonBoat MsgBoat = 5;
    optional int32 familyRank = 6;
    optional int32 playerRank = 7;
    optional bool isShow = 8;
}

message MsgDragonBoat {
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamily = 1;
    optional int32 lv = 2;
    optional int32 curHp = 3;
    optional int32 maxHp = 4;
    optional int64 lastFightTime = 5;
    repeated MsgAcceleration msgAcceleration = 6;
    optional int32 mile = 7;
    optional int64 mileTime = 8;
    optional int32 speed = 9;
    optional int32 rank = 10;
}

message MsgAcceleration {
    optional int32 itemId = 1;
    optional int64 endTime = 2;
}

message MsgAccelerationWithPlayerId {
    optional string playerId = 1;
    optional int32 itemId = 2;
    optional int64 endTime = 3;
}

message MsgAtkReport {
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgFamily = 1;
    optional int32 damage = 2;
    optional int32 suffer = 3;
}

message MsgDefReport {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgEnemy = 1;
    optional int32 killCnt = 2;
    optional int32 damage = 3;
    optional int64 timeStamp = 4;
}

message MsgDragonBoatBrief {
    optional MsgDragonBoat msgBoat = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgEnemy = 2;
    repeated int32 talentId = 3;
}

message MsgRefreshField {
    optional string playerId = 1;
    optional MsgBattleField msgField = 2;
}

message MsgRefreshBoat {
    optional string playerId = 1;
    optional MsgDragonBoatBrief msgBoat = 2;
}

message MsgDragonBoatBattleExtra {
