    repeated MsgAccelerationWithPlayerId msgAcceleration = 2;
    repeated MsgAccelerationWithPlayerId msgLoseEffect = 3;
    optional bool isComplete = 4;
    optional int32 mileRank = 5;
    optional int32 speedChange = 6;
}

message MsgAccelerateResult {
