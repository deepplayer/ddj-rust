}

message MsgGroupReport {
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgUser = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgEnemy = 2;
    optional bf.messages.game.FamilyMessage.MsgCrossFamilyData msgEnemyFamily = 3;
    optional int32 killCnt = 4;
    optional int64 timeStamp = 5;
}

message MsgBoatKafka {
