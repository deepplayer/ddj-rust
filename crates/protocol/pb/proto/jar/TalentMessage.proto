message TalentTeachSeatPutChildReq_3027 {
    optional int32 talentId = 1;
    optional int32 seatId = 2;
    optional string childId = 3;
}

message TalentTeachSeatPutChildResp_3027 {
    required int32 ret = 1;
    optional int32 talentId = 2;
    optional int32 seatId = 3;
    optional string childId = 4;
}

message TalentTeachSeatOneClickDispatchReq_3028 {
    optional int32 talentId = 1;
}

message TalentTeachSeatOneClickDispatchResp_3028 {
    required int32 ret = 1;
    repeated string upChildren = 2;
    repeated string downChildren = 3;
}

message ResetLog {
    optional int32 talentId = 1;
    optional int64 resetTime = 2;
    optional int32 skinId = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources cost = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgResources gain = 5;
}

message TalentResetLogReq_3029 {
}

message TalentResetLogResp_3029 {
    required int32 ret = 1;
    repeated ResetLog logs = 2;
}

message TalentAptitudeUpgradeByScrollTenTimesReq_3030 {
    optional int32 id = 1;
    optional int32 aptitudeSkillId = 2;
}

message TalentAptitudeUpgradeByScrollTenTimesResp_3030 {
    required int32 ret = 1;
    optional int32 aptitudeSkillId = 2;
    optional int32 successTimes = 3;
    optional int32 skillLevel = 4;
    optional int32 times = 5;
}

message EquipTreasureReq_3031 {
    required int32 talentId = 1;
