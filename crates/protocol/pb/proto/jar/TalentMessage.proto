}

message EquipTreasureResp_3031 {
    required int32 ret = 1;
}

message UpgradeTreasureReq_3032 {
    required int32 treasureId = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgCost = 2;
}

message UpgradeTreasureResp_3032 {
    required int32 ret = 1;
    optional bf.messages.game.CommonMsgMessage.MsgResources msgCost = 2;
    optional bf.messages.game.CommonMsgMessage.MsgResources msgGet = 3;
}

message LevelUpTreasureSkillReq_3033 {
    required int32 treasureId = 1;
    required int32 skillId = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources msgCost = 3;
}

message LevelUpTreasureSkillResp_3033 {
    required int32 ret = 1;
    optional bf.messages.game.CommonMsgMessage.MsgResources msgResources = 2;
}

message TreasureDataUpdateResp_3034 {
    repeated MsgTreasure msgTreasure = 1;
}
