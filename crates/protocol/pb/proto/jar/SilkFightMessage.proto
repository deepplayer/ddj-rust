syntax = "proto2";

package bf.messages.game.SilkFightMessage;

import "CommonMsgMessage.proto";
import "GmActivityMessage.proto";

message MsgSilkShopBrifData {
    optional int32 shopId = 1;
    optional int32 groupId = 2;
    optional int64 familyId = 3;
    optional string familyName = 4;
    optional int32 playerNum = 5;
    optional bool highProduce = 6;
}

message MsgSilkShopDetailData {
    optional int32 shopId = 1;
    optional int32 groupId = 2;
    optional int64 familyId = 3;
    optional string familyName = 4;
    repeated MsgSilkShopPlayerData playerDatas = 5;
    optional bool highProduce = 6;
}

message MsgSilkShopPlayerData {
    optional string playerId = 1;
    optional string playerName = 2;
    optional int32 serverId = 3;
    optional int64 produceSpeed = 4;
    optional int64 productNum = 5;
    optional int64 seatId = 6;
    repeated int32 fashionIds = 7;
    optional int32 sex = 8;
    optional string familyName = 9;
    optional string icon = 10;
    optional int32 vip = 11;
    optional string money = 12;
    optional int64 logTime = 13;
    optional bool isRob = 14;
    optional int64 shopId = 15;
    optional bool enemyWin = 16;
    optional int64 itemLost = 17;
    optional int64 familyId = 18;
    optional int32 npcSex = 19;
}

message MsgSilkShopLoctionData {
    optional int32 shopId = 1;
    optional int32 seatId = 2;
    optional int64 productNum = 3;
    optional int64 produceSpeed = 4;
    repeated int32 talentId = 5;
}

message MsgSilkShopTalentBrifData {
    optional string playerId = 1;
    optional int32 talentId = 2;
    optional int32 degree = 3;
    optional int32 skinId = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgTalentSkin msgTalentSkinLvs = 5;
    optional string money = 6;
    optional int32 lv = 7;
}

message MsgSilkShopNoticeData {
    optional string playerId = 1;
    optional string playerName = 2;
    optional string familyName = 3;
    optional int64 shopId = 4;
    optional int64 seatId = 5;
    repeated int32 fashionIds = 6;
    optional int32 sex = 7;
    optional string icon = 8;
    optional int32 vip = 9;
    optional string toPlayerName = 10;
    optional string toFamilyName = 11;
    optional int64 logTime = 12;
    optional bool isRob = 13;
    optional int32 serverId = 14;
    optional int32 toServerId = 15;
    optional int32 npcSex = 16;
}

message OccupyShopBrif {
    optional int32 shopId = 1;
    optional int32 seatId = 2;
    optional int32 produceSpeed = 3;
    optional int64 productNum = 4;
}

message MsgPlayerBrifData {
    optional string playerId = 1;
    optional string playerName = 2;
    optional int32 serverId = 3;
    repeated int32 fashionIds = 4;
    optional int32 sex = 5;
    optional string familyName = 6;
    optional string icon = 7;
    optional int32 vip = 8;
    optional string money = 9;
    optional int64 familyId = 10;
    optional int32 job = 11;
    repeated int32 pets = 12;
    optional bf.messages.game.CommonMsgMessage.MsgAddress address = 13;
    repeated int32 petUsedSkinIds = 14;
    optional int32 lv = 15;
    optional int32 familyIcon = 16;
    optional int32 npcSex = 17;
}

message MsgSilkFightKafkaData {
    optional string reason = 1;
    optional int32 silk_activity_id = 2;
    optional string silk_activity_name = 3;
    optional int32 silk_id = 4;
    optional int64 naming_family = 5;
    optional int32 seat_id = 6;
    optional int32 is_add = 7;
    optional string d_role_id = 10;
    optional string d_poewr = 11;
    optional string result = 12;
    repeated MsgSilkShopLoctionData have_cinema = 13;
    optional int64 silk_score_change = 14;
    optional int64 silk_score = 15;
    optional int32 silk_rank = 16;
    optional int64 family_id = 17;
    optional int64 silk_family_score = 18;
    optional int32 silk_family_rank = 19;
    optional int32 silk_shop_score = 20;
    optional int32 silk_rank_playerId = 21;
    optional int32 silk_rank_num = 22;
    optional int64 silk_rank_score = 23;
    optional int64 left_silk_shop_score = 24;
    optional bf.messages.game.CommonMsgMessage.MsgResources item_gain = 25;
    optional bf.messages.game.CommonMsgMessage.MsgResources item_use = 26;
    repeated MsgSilkShopTalentBrifData msgTalentData = 27;
    optional int32 silk_activity_group = 28;
}

message MsgAutoSettlement {
    optional string playerId = 1;
    optional int64 familyId = 2;
    optional int32 playerRank = 3;
    optional string playerScore = 4;
    optional int32 familyRank = 5;
    optional string familyScore = 6;
    repeated bf.messages.game.CommonMsgMessage.MsgResources itemGet = 7;
}

