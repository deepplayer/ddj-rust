    optional int32 killNum = 4;
    optional int32 gateHurt = 5;
    optional int32 gateHurtType = 6;
    repeated bf.messages.game.CommonMsgMessage.MsgResources rewards = 7;
    optional int32 addIntegral = 8;
}

message MsgEventLog {
    optional int32 type = 1;
    optional int64 fromFamilyId = 2;
    repeated bf.messages.game.CommonMsgMessage.MsgResources winRewards = 3;
    repeated bf.messages.game.CommonMsgMessage.MsgResources failRewards = 4;
    optional int32 gateId = 6;
    optional int32 dieGateNum = 7;
    optional int32 liveGateNum = 8;
    optional int32 talentHpAdd = 9;
    optional int32 winReason = 10;
    optional int32 talentId = 11;
    optional int32 killNum = 12;
