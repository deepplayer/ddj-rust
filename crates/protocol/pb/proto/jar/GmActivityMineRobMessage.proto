message MsgAllTemplateData {
    repeated bf.messages.game.GmActivityCommonMessage.MsgRankReward rankRewards = 1;
    repeated MsgTurnTemplateData turnData = 2;
    repeated MsgRewardTemplateData rewardData = 3;
    repeated MsgGuessTemplateData guessData = 4;
    repeated MsgBattleRewardTemplateData battleRewardData = 5;
}

message MsgTurnTemplateData {
    optional int32 id = 1;
    optional int32 turn = 2;
    optional int32 stageType = 3;
    optional int32 start = 4;
    optional int32 end = 5;
}

message MsgRewardTemplateData {
    optional int32 id = 1;
    optional string winReward = 2;
    optional string failReward = 3;
    optional string destroyReward = 4;
    optional string attackReward = 5;
    optional string rankRange = 6;
    optional string score = 7;
}

message MsgGuessTemplateData {
    optional int32 turn = 1;
    optional int32 guessNum = 2;
    optional string reward = 3;
}

message MsgBattleRewardTemplateData {
    optional string reward = 1;
    optional int32 kill = 2;
}

message MsgPlayerSimpleData {
    optional int32 onlyId = 1;
    optional bool isEnterFor = 2;
    optional int32 familyRank = 3;
    optional bool isJoin = 4;
    optional int32 playerRank = 5;
    optional int32 playerRankScore = 6;
    repeated bf.messages.game.GmActivityCommonMessage.MsgPlayerRankData rankData = 7;
    optional int32 mineId = 8;
    optional bool redEnroll = 11;
    optional bool redGuess = 12;
    optional bool redMain = 13;
}

message MsgPlayerData {
    optional int32 onlyId = 1;
    optional int32 mineId = 2;
    optional bf.messages.game.FamilyMessage.MsgFamilyData myFamily = 3;
    optional bf.messages.game.FamilyMessage.MsgFamilyData tarFamily = 4;
    repeated MsgGate gateData = 5;
    optional int32 canAttackNum = 6;
    optional int32 canDefenseNum = 7;
    optional int32 attackGateId = 8;
    optional bool btnDispatch = 9;
    optional int32 talentNum = 10;
    optional bool redEventLog = 21;
    optional bool redDispatch = 22;
    optional bool redAttack = 23;
}

message MsgGate {
    optional int64 familyId = 1;
    optional int32 gateId = 2;
    optional int32 dispatchNum = 3;
    optional int32 myDispatchNum = 4;
    optional int32 hpMax = 5;
    optional int32 hp = 6;
    optional string talentTotalHp = 7;
}

message MsgDefensePlayer {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 1;
    repeated MsgDefenseTalent talents = 2;
}

message MsgDefenseTalent {
    optional bf.messages.game.TalentMessage.MsgTalentData talent = 1;
    optional string maxHp = 2;
    optional string curHp = 3;
    optional int32 attackSub = 4;
    optional int32 canDispatchNum = 5;
    optional int32 gateId = 6;
}

message MsgAttackTalent {
    optional bf.messages.game.TalentMessage.MsgTalentData talent = 1;
    optional string maxHp = 2;
    optional string curHp = 3;
    optional int32 attackSub = 4;
    optional int32 hpUp = 5;
    optional int32 canAttackNum = 6;
}

message MsgBattleLog {
    optional int32 id = 1;
    optional int64 fromFamilyId = 2;
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer fromPlayer = 3;
    optional bool isWin = 5;
    optional int32 talentId = 6;
    optional int32 killNum = 7;
    optional int32 gateHurt = 8;
    optional bool haveVideo = 9;
    optional int64 addTime = 10;
}

message MsgBattleResult {
    optional int64 fromFamilyId = 1;
    optional MsgBattleSpirit attackSpirit = 2;
    optional MsgBattleSpirit defenseSpirit = 3;
    optional bool isWin = 4;
}

message MsgBattleSpirit {
    optional bf.messages.game.PlayerMessage.MsgOfflinePlayer player = 1;
    optional bf.messages.game.TalentMessage.MsgTalentData talent = 2;
    optional bf.messages.game.PetMessage.MsgPetData pet = 3;
    optional int32 attackSub = 4;
    optional string maxHp = 5;
    optional string curHp = 6;
    optional string hurt = 7;
}

message MsgBattleAttackGate {
    optional MsgGate gate = 1;
