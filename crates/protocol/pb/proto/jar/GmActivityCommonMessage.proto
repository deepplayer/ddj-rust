message MsgCrossQueryMyRankReq_39114 {
    optional MsgGmActivity activity = 1;
    repeated int32 rankType = 2;
    repeated string key = 3;
}

message MsgCrossQueryMyRankResp_39114 {
    required int32 ret = 1;
    repeated int32 rank = 2;
    repeated string integral = 3;
}

message MsgQueryRankDataReq_39115 {
    optional MsgGmActivity activity = 1;
    optional int32 rankType = 2;
    optional int32 num = 3;
}

message MsgQueryRankDataResp_39115 {
    required int32 ret = 1;
    optional bf.messages.game.RankingMessage.MsgRankingData info = 2;
    optional MsgGmActivity activity = 3;
    optional int32 rankType = 4;
}

message MsgCrossQueryRankDataReq_39116 {
    optional MsgGmActivity activity = 1;
    optional int32 rankType = 2;
    optional int32 num = 3;
    optional string key = 4;
}

message MsgCrossQueryRankDataResp_39116 {
    required int32 ret = 1;
    optional bf.messages.game.RankingMessage.MsgRankingData info = 2;
