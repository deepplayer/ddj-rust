syntax = "proto2";

package bf.messages.game.GmActivityCommonMessage;

import "CommonMsgMessage.proto";
import "PlayerMessage.proto";
import "RankingMessage.proto";

message MsgGmActivityShopTemplateData {
    optional int32 id = 1;
    optional int32 activityType = 2;
    optional int32 activityId = 3;
    optional string goodsList = 4;
    optional string price = 6;
    optional int32 buyLimit = 7;
    optional int32 buyType = 8;
    optional int32 limitCondition = 9;
    optional int32 limitValue = 10;
    optional string shopName = 11;
    optional string name = 12;
    optional string icon = 13;
    optional string originalPrice = 14;
    optional int32 discount = 15;
    optional int32 tab = 16;
    optional int32 bulkBuying = 17;
}

message MsgActivityCommodityBuyData {
    optional int32 activityType = 1;
    optional int32 activityId = 2;
    optional int32 id = 3;
    optional int32 buyCot = 4;
}

message MsgActivityShopPlayerData {
    repeated MsgActivityCommodityBuyData buyData = 1;
}

message ActivityShopBuyCommodityReq_39001 {
    optional int32 activityType = 1;
    optional int32 activityId = 2;
    optional int32 id = 3;
    optional int32 num = 4;
}

message ActivityShopBuyCommodityResp_39001 {
    required int32 ret = 1;
}

message ActivityShopGetReq_39002 {
}

message ActivityShopGetResp_39002 {
    required int32 ret = 1;
    repeated MsgActivityCommodityBuyData buyData = 2;
}

message ActivityRefreshShopReq_39003 {
    optional int32 activityType = 1;
    optional int32 activityId = 2;
}

message ActivityRefreshShopResp_39003 {
    required int32 ret = 1;
}

message MsgGmActivityTaskTemplateData {
    optional int32 activityId = 1;
    optional int32 activityType = 2;
    optional int32 tab = 3;
    optional string describe = 4;
    optional int32 taskId = 5;
    optional string remarks = 6;
    optional int32 conditionType = 7;
    optional string param1 = 8;
    optional string param2 = 9;
    optional int32 mailId = 10;
    optional int32 jump = 11;
    optional string icon = 12;
    optional string reward = 13;
}

message MsgActivityTaskPlayerData {
    optional int32 activityType = 1;
    optional int32 activityId = 2;
    optional int32 taskId = 3;
    optional string nowNum = 4;
    optional int32 status = 5;
}

message GmActivityTaskPlayerDataResp_31011 {
    repeated MsgActivityTaskPlayerData msgActivityTaskPlayerData = 1;
}

message CommitActivityTaskReq_31012 {
    optional int32 activityType = 1;
