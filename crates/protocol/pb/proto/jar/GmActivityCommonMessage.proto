}

message MsgQueryClientDataReq_39118 {
    optional int32 actType = 1;
    optional int32 actId = 2;
    optional string extId = 3;
}

message MsgQueryClientDataResp_39118 {
    required int32 ret = 1;
    optional int32 actType = 2;
    optional int32 actId = 3;
    optional string extId = 4;
