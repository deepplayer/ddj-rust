}

message GetEnergyPanelResp_39121 {
    required int32 ret = 1;
    repeated MsgEnergy msgEnergy = 2;
    optional int32 energyCnt = 3;
}

message GainEnergyReq_39122 {
    required MsgGmActivity msgGmActivity = 1;
