}

message OnekeyCommitActivityTaskReq_31013 {
    optional int32 activityType = 1;
    optional int32 activityId = 2;
    optional int32 conditionType = 3;
}

message OnekeyCommitActivityTaskResp_31013 {
    required int32 ret = 1;
    repeated bf.messages.game.CommonMsgMessage.MsgResources resources = 2;
}

message RemoteActivityGetStateReq_39021 {
    optional int32 activityType = 1;
