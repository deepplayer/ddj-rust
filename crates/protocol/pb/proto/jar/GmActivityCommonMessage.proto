}

message MsgDoCmdResp_39119 {
    required int32 ret = 1;
}

message MsgEnergy {
    optional int64 id = 1;
    optional bf.messages.game.PlayerMessage.MsgCrossUser msgPlayer = 2;
    optional int32 giftId = 3;
    optional int32 num = 4;
    optional int64 timeStamp = 5;
    optional bool isGain = 6;
}

