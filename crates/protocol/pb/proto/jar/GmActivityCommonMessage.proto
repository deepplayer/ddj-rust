}

message MsgBulletinPopup {
    optional int64 id = 1;
    optional int32 backImgId = 2;
    optional int32 titleId = 3;
    optional string content = 4;
    optional int64 guideId = 5;
    optional int64 startTime = 6;
    optional int64 endTime = 7;
}

message BulletinPopupsReq_39101 {
}

message BulletinPopupsResp_39101 {
    repeated MsgBulletinPopup popups = 1;
}

message MsgRankRewardTemplateData {
    repeated MsgRankReward rankRewards = 1;
}

message MsgRankReward {
    optional int32 activityId = 1;
    optional string remarks = 2;
    optional int32 rankIntervalBegin = 3;
    optional int32 rankIntervalEnd = 4;
    optional int32 rewardType = 5;
    repeated bf.messages.game.CommonMsgMessage.MsgResources specialReward = 6;
    repeated bf.messages.game.CommonMsgMessage.MsgResources reward = 7;
    optional int32 rankType = 8;
}

message MsgRankPlayerData {
    repeated int32 drawType = 1;
    optional bool join = 2;
}

message MsgPlayerRankData {
    optional int32 rankType = 1;
    optional int32 status = 2;
}

message MsgGainRankRewardReq_39111 {
    optional int32 activityType = 1;
    optional int32 activityId = 2;
    optional int32 rankType = 3;
}

message MsgGainRankRewardResp_39111 {
    required int32 ret = 1;
    optional int32 activityType = 2;
    optional int32 activityId = 3;
    optional int32 rankType = 4;
    repeated bf.messages.game.CommonMsgMessage.MsgResources reward = 5;
}

message MsgGmActivity {
    optional int32 actId = 1;
    optional int32 actType = 2;
    optional int32 actGroup = 3;
}

message MsgTransferItem {
    optional int32 templateId = 1;
    optional int64 num = 2;
    optional string score = 3;
}

message MsgCrossPushIntegralChgReq_39112 {
    optional MsgGmActivity activity = 1;
    optional int32 serverId = 2;
    optional bool updPlayer = 5;
    optional string playerId = 6;
    optional int64 playerValue = 7;
    optional bool updFamily = 8;
    optional int64 familyId = 9;
    optional int64 familyValue = 10;
    optional bool removeFamily = 11;
    optional int64 removeFamilyId = 12;
}

message MsgCrossPushIntegralChgResp_39112 {
    required int32 ret = 1;
    optional int32 playerRank = 2;
    optional int32 familyRank = 3;
}

message MsgQueryMyRankReq_39113 {
