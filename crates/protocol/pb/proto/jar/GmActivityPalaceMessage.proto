message MsgGameData {
    optional int32 modeType = 21;
    optional int32 round = 1;
    optional int32 npcId = 2;
    optional int32 roleId = 3;
    optional int32 resultType = 4;
    optional int32 npcHp = 5;
    optional int32 npcHpMax = 6;
    repeated MsgGameBuffIcon npcBuff = 7;
    repeated MsgGameNpcActionIcon npcAction = 8;
    optional int32 npcSkillId = 9;
    optional int32 hp = 11;
    optional int32 hpMax = 12;
    optional int32 energy = 13;
    optional int32 energyMax = 14;
    repeated MsgGameCard card = 15;
    repeated MsgGameBuffIcon buff = 16;
    repeated MsgTreasure herb = 17;
    repeated MsgTreasure treasure = 18;
    optional int32 drawNum = 19;
    optional int32 throwNum = 20;
}

message MsgGameCard {
    optional int32 onlyId = 1;
    optional int32 id = 2;
    repeated int32 param = 3;
    optional bool canPlay = 4;
}

message MsgGameBuff {
    optional int32 buffId = 1;
    repeated int32 param = 2;
    optional int32 round = 3;
}

message MsgGameBuffIcon {
    optional int32 buffId = 1;
    optional int32 num = 2;
    optional bool isExpire = 3;
}

message MsgGameNpcAction {
    optional int32 planId = 1;
    repeated int32 param = 2;
}

message MsgGameNpcActionIcon {
    optional int32 planId = 1;
    optional int32 num = 2;
    optional int32 extraNum = 3;
}

message MsgStageTriggerData {
    optional int32 stage = 1;
    repeated MsgGoodsEffect goodsEffect = 2;
    repeated MsgGameNpcActionIcon npcAction = 3;
}

message MsgGoodsEffect {
    optional int32 type = 1;
    optional int32 treasureId = 2;
    optional MsgGameBuffIcon buff = 3;
    repeated MsgEffect effect = 4;
    optional int32 order = 5;
}

message MsgCardEffect {
    optional int32 type = 1;
    optional int32 id = 2;
    repeated MsgCardEffectUnit cardEffect = 3;
}

message MsgCardEffectUnit {
    optional MsgEffect cardEffect = 1;
    repeated MsgGoodsEffect goodsEffect = 2;
}

message MsgEffect {
    optional int32 playerAddHp = 11;
    optional int32 playerAttackCostHp = 12;
    optional int32 playerCostHp = 13;
    optional int32 playerAddHpMax = 14;
    repeated MsgGameCard playerDrawCard = 15;
    repeated MsgGameCard playerGetCard = 16;
    optional int32 playerAddEnergy = 17;
    optional int32 playerAttackHurt = 18;
    repeated MsgGameBuffIcon playerChgBuff = 19;
    repeated int32 playerRemoveCardOnlyId = 20;
    optional int32 reverseId = 21;
    optional int32 tips = 23;
    optional int32 npcAddHp = 31;
    optional int32 npcAttackCostHp = 32;
    optional int32 npcCostHp = 33;
    optional int32 npcAttackHurt = 34;
    repeated MsgGameBuffIcon npcChgBuff = 35;
}

