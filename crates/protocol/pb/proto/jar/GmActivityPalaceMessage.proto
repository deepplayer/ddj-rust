syntax = "proto2";

package bf.messages.game.GmActivityPalaceMessage;

import "CommonMsgMessage.proto";
import "GmActivityCommonMessage.proto";

message MsgAllTemplateData {
    repeated bf.messages.game.GmActivityCommonMessage.MsgRankReward rankRewards = 1;
    repeated MsgRewardTemplate taskRewards = 2;
    repeated MsgRechargeTemplate recharge = 3;
}

message MsgRewardTemplate {
    optional int32 id = 1;
    optional int32 stage = 2;
    optional int32 floor = 3;
    optional string reward = 4;
}

message MsgRechargeTemplate {
    optional int32 giftId = 1;
    optional int32 giftType = 10;
    optional int32 payType = 2;
    optional string originalPrice = 11;
    optional string price = 12;
    optional int32 discount = 13;
    optional int32 rmb = 3;
    optional int32 overseasPayId = 4;
    optional int32 vipExp = 5;
    optional string voucher = 6;
    optional string name = 7;
    optional string addition = 8;
    optional string reward = 9;
    optional int32 treasure = 14;
}

message MsgSimplePlayerData {
    repeated bf.messages.game.GmActivityCommonMessage.MsgPlayerRankData rankData = 1;
    repeated int32 gainTaskId = 2;
    optional int32 curStage = 3;
    optional int32 curFloor = 4;
    optional int32 playerRank = 5;
    optional int32 familyRank = 6;
    repeated int32 buyGiftId = 7;
    optional bool unlockDungeon = 8;
}

message MsgPlayerData {
    optional int32 roleId = 1;
    optional MsgRoleAttr roleAttr = 2;
    repeated MsgCard card = 3;
    repeated int32 choiceCardId = 4;
    repeated MsgTreasure treasure = 5;
    repeated MsgTreasure herb = 6;
    optional MsgMapData mapData = 8;
    optional int32 status = 9;
    repeated MsgGoods goods = 10;
    optional int32 rank = 11;
    optional int32 score = 12;
    repeated int32 buyGiftId = 13;
    optional int32 backNum = 14;
    optional bool unlockPlayBatch = 15;
    repeated MsgPushGift pushGift = 16;
    optional bf.messages.game.CommonMsgMessage.MsgResources chgRolePrice = 17;
    optional bool redShop = 21;
}

message MsgRoleAttr {
    optional int32 hpMax = 1;
    optional int32 hp = 2;
    optional int32 power = 3;
    optional int32 defense = 4;
    optional int32 magicPower = 5;
}

message MsgMapData {
    optional int32 stage = 1;
    repeated MsgMapCell cell = 2;
    optional MsgPos myPos = 3;
    optional MsgMapCell choiceEvent = 4;
}

message MsgMapCell {
    optional MsgPos pos = 1;
    optional int32 eventId = 2;
    optional int32 monsterId = 5;
    optional int32 monsterHp = 7;
    optional int32 randomEventId = 6;
}

message MsgPos {
    optional int32 row = 1;
    optional int32 col = 2;
}

message MsgCard {
    optional int32 cardId = 1;
    optional int32 lv = 2;
    optional int32 num = 3;
    optional int32 progress = 4;
}

message MsgTreasure {
    optional int32 id = 1;
    optional int32 num = 2;
}

message MsgShop {
    optional int64 nextRefreshTime = 1;
    optional bf.messages.game.CommonMsgMessage.MsgResources refreshPrice = 2;
    repeated MsgShopItem shopItem = 3;
}

message MsgShopItem {
    optional int32 id = 1;
    optional int32 type = 2;
    optional int32 templateId = 3;
    optional bf.messages.game.CommonMsgMessage.MsgResources price = 4;
    optional int32 rate = 5;
    optional bool isBuy = 6;
}

message MsgGoods {
    optional int32 type = 1;
    repeated int32 id = 2;
}

message MsgPushGift {
    optional int32 giftId = 1;
    optional int64 endTime = 2;
}

message MsgCardGroup {
    optional int32 groupId = 1;
    repeated int32 cardId = 2;
}

message MsgRankExt {
    optional int32 roleId = 1;
}

message MsgDungeon {
    optional int32 roleId = 1;
    optional MsgRoleAttr roleAttr = 2;
    repeated MsgCard card = 3;
    repeated int32 choiceCardId = 4;
    repeated MsgTreasure treasure = 5;
    optional int32 choiceNpcId = 6;
    optional int32 updStateType = 7;
    optional bool isGaming = 8;
}

