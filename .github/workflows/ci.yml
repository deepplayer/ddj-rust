name: CI

# 与仓库内 scripts/ci.sh 保持一致：
#   fmt（移植期跳过）→ clippy（--lib --bins）→ test → release 构建
#
# 为什么不用 --all-targets：
#   crates/app/game-handler/src/runtime.rs 的 #[cfg(test)] mod tests 位于文件中段，
#   --all-targets 会编 lib test target 并触发 clippy::items_after_test_module 的 deny 错误。
#   项目约定以 scripts/ci.sh 的 --lib --bins 为准。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 注意：.cargo/config.toml 里刻意不写 jobs（本地 1.9 GB 内存需要 jobs=1，
  # 而远端 32 核需要高并行）。CI runner 是 4 核 / 16 GB，走默认即可。
  # ddj-pb 单 crate 编译峰值约 900 MB，4 路并行远在 16 GB 之内。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 已声明 stable + rustfmt/clippy/rust-src，
      # rustup 进入仓库目录时会自动安装，这里只确保 stable 已就位。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存键带上 toolchain 与 profile，避免不同配置互相污染。
          prefix-key: v1-rust
          shared-key: ci-check

      - name: 分层依赖校验
        run: cargo run -p xtask -- check-arch

      - name: clippy
        run: cargo clippy --workspace --exclude ddj-pb --lib --bins -- -D warnings

      - name: test
        run: cargo test --workspace

  # 格式检查单独成 job 且不阻塞：移植期尚未统一格式化（21 个文件有 diff），
  # 等全部移植完成后再把它改成 required。
  fmt:
    name: rustfmt（仅报告，不阻塞）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  release:
    name: release 构建
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: ci-release

      - name: build release
        run: cargo build --release -p ddj-cli

      - name: 校验产物
        run: |
          set -euo pipefail
          test -x target/release/ddj
          ls -lh target/release/ddj
          sha256sum target/release/ddj
          target/release/ddj --version || true

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: ddj-${{ github.sha }}
          path: target/release/ddj
          if-no-files-found: error
          retention-days: 14
