name: 3 test

# 单一职责：只跑测试。不跑 clippy、不构建 release。
# 为什么单独：测试是最慢的一步（全量 867 个），而且它失败与 lint 失败要分开看。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: test
      - name: cargo test
        run: cargo test --workspace
